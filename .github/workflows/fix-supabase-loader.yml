name: Fix Supabase browser startup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Supabase loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="erp-app-code"' in s:
              print('Loader patch already present')
              raise SystemExit(0)

          # Remove the old single-CDN scripts.
          s = s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>\n', '')
          s = s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n', '')
          s = s.replace('<script src="https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>\n', '')

          # Remove the previous error/timer patch because it can fire before a fallback module loads.
          start = s.find('<!-- ERP CDN FALLBACK -->')
          if start != -1:
              end = s.find('</head>', start)
              if end == -1:
                  raise SystemExit('Could not find </head> after old fallback block')
              s = s[:start] + s[end:]

          app_marker = '<script>\nconst SUPABASE_URL='
          if app_marker not in s:
              raise SystemExit('Could not find ERP app script marker')
          s = s.replace(app_marker, '<script id="erp-app-code" type="text/plain">\nconst SUPABASE_URL=', 1)

          search_marker = '<script>\n/* MARKCHARLES SEARCH V2 */'
          if search_marker not in s:
              raise SystemExit('Could not find Search V2 script marker')
          s = s.replace(search_marker, '<script id="erp-search-code" type="text/plain">\n/* MARKCHARLES SEARCH V2 */', 1)

          loader = r'''<script type="module">
          (async function(){
            const sources = [
              'https://esm.sh/@supabase/supabase-js@2.116.0?bundle',
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/+esm',
              'https://unpkg.com/@supabase/supabase-js@2.116.0?module'
            ];
            let mod = null;
            let lastError = null;
            for (const src of sources) {
              try {
                mod = await import(src);
                if (mod && typeof mod.createClient === 'function') break;
              } catch (e) { lastError = e; }
            }
            const root = document.getElementById('root');
            if (!mod || typeof mod.createClient !== 'function') {
              if (root) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#101827;color:#fff;font-family:Arial,sans-serif"><div style="background:#fff;color:#17202f;padding:30px;border-radius:14px;max-width:620px;width:92%"><h2 style="margin-top:0">Markcharles ERP could not connect</h2><p>The browser could not load the Supabase service library. Please check the internet connection, disable any browser extension or network filter blocking CDNs, and refresh.</p><p style="font-size:12px;color:#667085">Tried multiple Supabase-compatible browser module sources.</p></div></div>';
              console.error('Supabase startup failed', lastError);
              return;
            }
            window.supabase = { createClient: mod.createClient };
            for (const id of ['erp-app-code','erp-search-code']) {
              const source = document.getElementById(id);
              if (!source) continue;
              const script = document.createElement('script');
              script.textContent = source.textContent;
              source.replaceWith(script);
            }
          })();
          </script>
          '''
          if '</body></html>' not in s:
              raise SystemExit('Could not find document end')
          s = s.replace('</body></html>', loader + '</body></html>', 1)
          p.write_text(s, encoding='utf-8')
          print('Patched', len(s), 'bytes')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Fix Supabase browser startup with multi-CDN loader"
          git push