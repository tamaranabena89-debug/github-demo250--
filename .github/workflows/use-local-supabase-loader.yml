name: Use local Supabase loader in ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace external Supabase loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="https://unpkg.com/@supabase/supabase-js@2"></script>'
          new = '<script src="/api/supabase-js.js"></script>'
          if new in s:
              print('Local Supabase loader already configured')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected external Supabase loader was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Updated index.html to use same-origin Supabase loader')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use same-origin Supabase loader'
          git push