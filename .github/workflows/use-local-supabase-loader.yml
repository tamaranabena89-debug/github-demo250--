name: Fix ERP Supabase startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ERP startup
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace the browser CDN with the same-origin Vercel function.
          for old in [
              '<script src="https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>',
              '<script src="https://unpkg.com/@supabase/supabase-js@2"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          ]:
              s = s.replace(old, '<script src="/api/supabase-js.js"></script>')

          # Keep app code inert until Supabase is loaded.
          if '<script id="erp-app-code" type="text/plain">' not in s:
              s = s.replace('<script>\nconst SUPABASE_URL=', '<script id="erp-app-code" type="text/plain">\nconst SUPABASE_URL=', 1)

          # Add the same-origin loader if it is missing.
          if '/api/supabase-js.js' not in s:
              s = s.replace('</body>', '<script src="/api/supabase-js.js"></script>\n</body>', 1)

          # Start the ERP only after window.supabase exists.
          if '<!-- ERP SAME-ORIGIN BOOT -->' not in s:
              boot = '''
<script>
<!-- ERP SAME-ORIGIN BOOT -->
(function(){
  function boot(){
    var source=document.getElementById('erp-app-code');
    if(!source) return;
    if(!window.supabase || typeof window.supabase.createClient !== 'function'){
      setTimeout(boot,100);
      return;
    }
    var script=document.createElement('script');
    script.textContent=source.textContent;
    source.replaceWith(script);
  }
  boot();
})();
</script>
'''
              s = s.replace('</body>', boot + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('ERP startup patch complete')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ERP Supabase startup'
          git push
