name: Fix ERP Supabase startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix index loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Any browser Supabase CDN tag is replaced with the same-origin Vercel function.
          s = re.sub(r'<script\s+src=["\']https?://[^"\']*supabase-js[^"\']*["\']\s*></script>', '<script src="/api/supabase-js.js"></script>', s, count=1, flags=re.I)

          # Remove the old startup patch which can display a false failure while the loader is working.
          start = s.find('<!-- ERP CDN FALLBACK -->')
          if start >= 0:
              end = s.find('</head>', start)
              if end >= 0:
                  s = s[:start] + s[end:]

          # Keep the ERP application source inert until Supabase is available.
          s = s.replace('<script id="erp-app-code" type="text/plain">', '<script id="erp-app-code" type="text/plain">', 1)
          if 'id="erp-app-code"' not in s:
              s = s.replace('<script>\nconst SUPABASE_URL=', '<script id="erp-app-code" type="text/plain">\nconst SUPABASE_URL=', 1)

          # Remove any duplicate same-origin boot blocks from previous attempts.
          s = re.sub(r'\n?<script[^>]*>\s*<!-- ERP SAME-ORIGIN BOOT -->.*?</script>\s*', '\n', s, count=0, flags=re.S)

          boot = '''
<script>
<!-- ERP SAME-ORIGIN BOOT -->
(function(){
  function boot(){
    var source=document.getElementById('erp-app-code');
    if(!source) return;
    if(!window.supabase || typeof window.supabase.createClient !== 'function'){
      setTimeout(boot,100);
      return;
    }
    var script=document.createElement('script');
    script.textContent=source.textContent;
    source.replaceWith(script);
  }
  boot();
})();
</script>
'''

          if '/api/supabase-js.js' not in s:
              s = s.replace('</body>', '<script src="/api/supabase-js.js"></script>\n</body>', 1)
          if '<!-- ERP SAME-ORIGIN BOOT -->' not in s:
              s = s.replace('</body>', boot + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('ERP startup fixed:', '/api/supabase-js.js' in s and '<!-- ERP SAME-ORIGIN BOOT -->' in s)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ERP Supabase startup loader'
          git push
