name: Fix Procurement Customer Column
on:
  push:
    paths:
      - '.github/workflows/fix-procurement-customer-column.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nonexistent procurement customer_id field
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="customer_id:pCustomer.value||null,"
          if old in s:
              s=s.replace(old,'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix procurement customer column mismatch'
          git push