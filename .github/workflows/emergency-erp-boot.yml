name: Emergency ERP boot fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair static ERP boot
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove every known external Supabase browser loader and old startup patches.
          import re
          s=re.sub(r'<script[^>]+src=["\']https?://[^"\']*supabase-js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          for marker in ['<!-- ERP CDN FALLBACK -->','<!-- ERP STARTUP PATCH V2 -->']:
              start=s.find(marker)
              if start!=-1:
                  end=s.find('</head>',start)
                  if end!=-1: s=s[:start]+s[end:]
          # Keep the application inert until the same-origin library has loaded.
          if 'id="erp-app-code"' not in s:
              s=s.replace('<script>\nconst SUPABASE_URL=','<script id="erp-app-code" type="text/plain">\nconst SUPABASE_URL=',1)
          # Remove any previous boot block/loader variants.
          s=re.sub(r'<script[^>]*type=["\']module["\'][^>]*>\s*\(async function\(\)\{.*?</script>\s*','',s,flags=re.I|re.S)
          s=re.sub(r'<script[^>]*>\s*\(function\(\)\{\s*function boot\(\).*?</script>\s*','',s,flags=re.I|re.S)
          boot='''<script src="/api/supabase-js.js"></script>\n<script>\n(function(){\n  var root=document.getElementById('root');\n  var source=document.getElementById('erp-app-code');\n  function start(){\n    if(!source) return;\n    if(!window.supabase || typeof window.supabase.createClient !== 'function'){\n      setTimeout(start,100);\n      return;\n    }\n    var script=document.createElement('script');\n    script.textContent=source.textContent;\n    source.replaceWith(script);\n  }\n  start();\n})();\n</script>\n'''
          s=s.replace('</body>',boot+'</body>',1)
          p.write_text(s,encoding='utf-8')
          Path('vercel.json').unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vercel.json
          git diff --cached --quiet || git commit -m 'Repair ERP boot directly'
          git push