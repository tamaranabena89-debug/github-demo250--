<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markcharles Garment Factory ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202f}
button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:#101827}
.loginbox{background:#fff;width:min(420px,92%);padding:30px;border-radius:16px;box-shadow:0 20px 50px #0003}
.brand{font-weight:800;letter-spacing:.8px}.muted{color:#667085;font-size:13px}
input,select,textarea{width:100%;padding:10px 11px;margin:5px 0 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer}.btn.gray{background:#667085}.btn.danger{background:#b42318}
.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#101827;color:#fff;padding:18px 12px;overflow:auto}
.side h2{margin:3px 8px 0}.side small{display:block;margin:4px 8px 18px;color:#aab4c5}
.navbtn{display:block;width:100%;padding:11px 12px;background:none;border:0;color:#dbe3ef;text-align:left;border-radius:8px;cursor:pointer;margin:2px 0}
.navbtn:hover,.navbtn.active{background:#243148;color:#fff}.logout{margin-top:18px}
.main{margin-left:235px;padding:26px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
h1{margin:0 0 4px;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:17px}.metric{font-size:27px;font-weight:800;margin-top:5px}
.tablewrap{overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-top:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}
.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px}.green{background:#dcfce7;color:#166534}.amber{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.empty{padding:30px;text-align:center;color:#667085}
.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:14px;padding:22px;width:min(520px,95%);max-height:90vh;overflow:auto}
.actions{display:flex;gap:8px;justify-content:flex-end}.error{color:#b42318;margin-top:10px}.success{color:#067647;margin-top:10px}
@media(max-width:850px){.side{width:64px;padding:12px 8px}.side h2,.side small,.navbtn span{display:none}.main{margin-left:64px;padding:18px}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.top{display:block}}

.markbar{background:linear-gradient(135deg,#101827,#243148);color:#fff;border-radius:14px;padding:18px;margin:18px 0}.markbar h3{margin:0 0 4px;color:#f0c060}.markbar p{margin:0;color:#cbd5e1;font-size:13px}.mark-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mark-actions .btn{background:#f0c060;color:#101827;font-weight:800}.mark-result{white-space:pre-wrap;line-height:1.65;color:#17202f;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:12px}.mark-modal{width:min(760px,94vw);max-height:86vh;overflow:auto}.mark-msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;line-height:1.55}.mark-user{background:#101827;color:#fff;margin-left:15%}.mark-ai{background:#f5f7fa;color:#17202f;margin-right:15%}.mark-input{display:flex;gap:8px;margin-top:12px}.mark-input textarea{margin:0;min-height:48px}.mark-chip{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPABASE_URL="https://tnbvlecniuwshiheiokl.supabase.co";
const SUPABASE_KEY="sb_publishable_Gqm3hqeCqvxmR59Wie-mEA_eO1MgwVK";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, profile=null, view="dashboard";

const menu=[
 ["dashboard","Dashboard"],["orders","Orders"],["salesactivity","Sales Calls & WhatsApp"],["production","Production"],
 ["procurement","Procurement"],["inventory","Store"],["qa","QA/QC"],
 ["customers","Customers"],["payments","Payments"],["staff","Staff"],["roles","Roles & Permissions"],["audit","Audit Log"]
];
const perms={
 Tailor:[],Finisher:[],
 Management:menu.map(x=>x[0]),
 Sales:["dashboard","orders","salesactivity","customers","payments","inventory","qa","procurement","production"],
 Procurement:["dashboard","procurement","inventory"],
 Store:["dashboard","inventory","qa","procurement","orders","production"],
 Production:["dashboard","orders","production"],
 "QA/QC":["dashboard","orders","qa"],
 Accounts:["dashboard","payments"],
 Delivery:["dashboard","orders"]
};
const money=n=>"₦"+Number(n||0).toLocaleString();
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function stageOptions(selected){
 const stages=["Procurement","Awaiting Fitting","Cutting","Sewing","Finishing","Packaging","QA/QC","Delivery","Completed","Rework","On Hold"];
 return stages.map(v=>'<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(v)+'</option>').join("");
}

function can(v){return profile && (v==="roles" ? profile.role==="Management" : (perms[profile.role]||[]).includes(v))}

async function init(){
 const s=await db.auth.getSession();
 if(s.data.session){user=s.data.session.user;await loadProfile()}
 render();
}
async function loadProfile(){
 const r=await db.from("profiles").select("*").eq("id",user.id).single();
 profile=r.data||null;
}
async function signIn(){
 loginErr.textContent="";
 const r=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});
 if(r.error){loginErr.textContent=r.error.message;return}
 user=r.data.user;await loadProfile();render();
}
async function signOut(){await db.auth.signOut();user=null;profile=null;render()}
function render(){
 if(!user){
  root.innerHTML=`<div class="login"><div class="loginbox">
  <div class="brand">MARKCHARLES GARMENT FACTORY</div><h1 style="margin-top:8px">ERP Login</h1>
  <p class="muted">Sign in with your assigned staff account.</p>
  <label>Email<input id="loginEmail" type="email" autocomplete="username"></label>
  <label>Password<input id="loginPassword" type="password" autocomplete="current-password"></label>
  <button class="btn" style="width:100%" onclick="signIn()">Sign in</button>
  <div id="loginErr" class="error"></div></div></div>`;return;
 }
 if(!profile || !profile.active || profile.role==="Pending"){
  root.innerHTML=`<div class="login"><div class="loginbox"><h2>Account not ready</h2><p>Your account has not been assigned an active ERP role.</p><button class="btn gray" onclick="signOut()">Sign out</button></div></div>`;return;
 }
 root.innerHTML=`<div class="app"><aside class="side"><h2>MARKCHARLES</h2><small>Garment Factory ERP</small><div id="nav"></div><button class="navbtn logout" onclick="signOut()">↪ <span>Log out</span></button></aside>
 <main class="main"><div class="top"><div><h1 id="pageTitle"></h1><div class="muted">${esc(profile.full_name)} · ${esc(profile.role)}</div></div><div style="display:flex;gap:8px;align-items:center"><button class="btn" style="background:#f0c060;color:#101827;font-weight:800" onclick="openMark()">🧠 MARK</button><span class="pill green">Cloud connected</span></div></div><div id="content"></div></main></div>`;
 buildNav(); go(view);
}
function buildNav(){
 nav.innerHTML=menu.filter(x=>can(x[0])).map(x=>`<button class="navbtn ${view===x[0]?"active":""}" onclick="go('${x[0]}')">▸ <span>${x[1]}</span></button>`).join("");
}
async function go(v){
 if(!can(v))v="dashboard";view=v;buildNav();
 pageTitle.textContent={dashboard:"Factory Dashboard",orders:"Orders",salesactivity:"Sales Calls & WhatsApp",production:"Live Production",procurement:"Procurement",inventory:"Store / Inventory",qa:"QA / QC",customers:"Customers",payments:"Payments",staff:"Staff",roles:"Roles & Permissions",audit:"Audit Log"}[v];
 ({dashboard,orders,salesactivity,production,procurement,inventory,qa,customers,payments,staff,roles,audit}[v])();
}
async function changeStaffName(id,name){
 if(profile?.role!=="Management") return alert("Only Management can change staff names.");
 const fullName=prompt("Enter the new name for "+name+":",name||"");
 if(fullName===null)return;
 if(!fullName.trim())return alert("Name cannot be empty.");
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Your Management session has expired. Sign in again.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/admin-change-staff-name",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({user_id:id,full_name:fullName.trim()})});
 const out=await r.json();
 if(!r.ok)return alert(out.error||"Unable to change name.");
 alert("Name changed successfully.");
 staff();
}
async function changeStaffEmail(id,name,currentEmail){
 if(profile?.role!=="Management") return alert("Only Management can change staff emails.");
 const email=prompt("Enter the new email for "+name+":",currentEmail||"");
 if(email===null)return;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert("Enter a valid email address.");
 if(email.toLowerCase()===(currentEmail||"").toLowerCase())return;
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Your Management session has expired. Sign in again.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/admin-change-staff-email",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({user_id:id,email})});
 const out=await r.json();
 if(!r.ok)return alert(out.error||"Unable to change email.");
 alert("Email changed successfully to "+email+".");
 staff();
}
async function resetStaffPassword(id,name){
 if(profile?.role!=="Management") return alert("Only Management can reset staff passwords.");
 const pw=prompt("Set a new temporary password for "+name+" (minimum 6 characters):","");
 if(pw===null)return;
 if(pw.length<6)return alert("Password must be at least 6 characters.");
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Your Management session has expired. Sign in again.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/admin-reset-staff-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({user_id:id,password:pw})});
 const out=await r.json();
 if(!r.ok)return alert(out.error||"Unable to reset password.");
 alert("Password reset successfully for "+name+".");
}
async function deleteStaffAccount(id,name){
 if(profile?.role!=="Management") return alert("Only Management can delete staff.");
 if(id===user.id) return alert("You cannot delete your own Management account.");
 if(!confirm("Delete staff member "+name+" and their login account? This cannot be undone.")) return;
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Your session has expired. Sign in again.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/admin-delete-user",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({user_id:id})});
 const out=await r.json();
 if(!r.ok)return alert(out.error||"Unable to delete staff account.");
 staff();
}
async function deleteRow(table,id,label){
 if(profile?.role!=="Management") return alert("Only Management can delete records.");
 if(!confirm("Delete "+label+"? This cannot be undone.")) return;
 const r=await db.from(table).delete().eq("id",id);
 if(r.error){alert(r.error.message);return}
 go(view);
}
async function dashboard(){
 const [o,pr,i,t,pt,st]=await Promise.all([
  db.from("orders").select("*,customers(name)"),
  db.from("procurement_requests").select("*").neq("status","Received"),
  db.from("inventory_items").select("*"),
  db.from("store_transactions").select("*,inventory_items(name,unit),profiles:assigned_to(full_name,role),orders(order_no,customers(name))").order("created_at",{ascending:false}).limit(20),
  db.from("order_production_items").select("*,orders(order_no,product,customers(name)),profiles:assigned_to(full_name,role)").order("created_at",{ascending:false}).limit(30),
  db.from("profiles").select("id,full_name,role").eq("active",true).order("full_name")
 ]);
 const orders=o.data||[],req=pr.data||[],inv=i.data||[],tx=t.data||[],tasks=pt.data||[],staff=st.data||[];
 const value=orders.reduce((sum,x)=>sum+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0),outstanding=orders.reduce((sum,x)=>sum+Math.max(0,(Number(x.quantity)||0)*(Number(x.unit_price)||0)-(Number(x.paid)||0)),0),low=inv.filter(x=>Number(x.stock)<=Number(x.reorder_level)).length;
 const today=new Date(),days=d=>d?Math.ceil((new Date(d+"T23:59:59").getTime()-today.getTime())/86400000):999,active=orders.filter(x=>x.stage!=="Completed"),overdue=active.filter(x=>days(x.due_date)<0).length,risk=active.filter(x=>days(x.due_date)>=0&&days(x.due_date)<=3).length,stages=["Procurement","Awaiting Fitting","Cutting","Sewing","Finishing","Packaging","QA/QC","Delivery","Completed","Rework","On Hold"];
 const issued=tx.filter(x=>["Issue","Issued"].includes(x.transaction_type));
 content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Active Orders</div><div class="metric">${active.length}</div></div><div class="card"><div class="muted">Pipeline Value</div><div class="metric">${money(value)}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric" style="color:#b42318">${money(outstanding)}</div></div><div class="card"><div class="muted">At Risk / Overdue</div><div class="metric" style="color:#d97706">${risk} / ${overdue}</div></div></div>
 <div class="markbar"><div style="display:flex;justify-content:space-between"><div><div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#f0c060">AI BUSINESS MANAGER</div><h3>MARK's Factory Brief</h3><p>MARK reads the live ERP and tells you what needs attention.</p></div><div style="font-size:28px">🧠</div></div><div class="mark-actions"><button class="btn" onclick="askMark('Give me my factory morning brief. Tell me the top 5 priorities today, production bottlenecks, money I should collect, procurement blockers and what I should personally handle.')">Generate Morning Brief</button><button class="btn" onclick="askMark('What is urgent right now?')">What's Urgent?</button><button class="btn" onclick="askMark('Who owes us money and who should we follow up with first?')">Chase Payments</button></div><div id="dashboardMarkResult"></div></div>
 <div class="card"><h3>Factory Snapshot</h3><p class="muted">Customer names, production stages and assigned work.</p><div class="grid">${stages.map(stage=>{const list=orders.filter(x=>(x.stage||"Procurement")===stage);return `<div class="card" style="margin:0"><div class="metric">${list.length}</div><b>${stage}</b>${list.slice(0,5).map(x=>`<div style="margin-top:7px"><b>${esc(x.customers?.name||"Unknown customer")}</b><div class="muted">${esc(x.order_no)} · ${esc(x.product)} · ${x.quantity} ${esc(x.unit||"pcs")}</div></div>`).join("")}${list.length>5?`<div class="muted" style="margin-top:6px">+${list.length-5} more</div>`:""}</div>`}).join("")}</div></div>
 <div class="card"><h3>Assigned Production Tasks</h3><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Production Item</th><th>Qty</th><th>Stage</th><th>Assigned To</th><th>Status</th></tr>${tasks.map(x=>`<tr><td><b>${esc(x.orders?.customers?.name||"Unknown")}</b></td><td>${esc(x.orders?.order_no||"")}</td><td>${esc(x.item_name)}</td><td>${x.quantity} ${esc(x.unit)}</td><td>${esc(x.stage)}</td><td>${esc(x.profiles?.full_name||"Unassigned")}</td><td>${esc(x.status)}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No production tasks assigned yet</td></tr>`}</table></div></div>
 <div class="card"><h3>Accessories Issued to Staff</h3><div class="tablewrap"><table class="table"><tr><th>Staff</th><th>Accessory</th><th>Qty</th><th>Unit</th><th>Order</th><th>Time</th></tr>${issued.map(x=>`<tr><td><b>${esc(x.profiles?.full_name||"Unassigned")}</b></td><td>${esc(x.inventory_items?.name||"")}</td><td>${x.quantity}</td><td>${esc(x.unit)}</td><td>${esc(x.orders?.order_no||"General Stock")}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No accessories issued yet</td></tr>`}</table></div></div>
 <div class="tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Product</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Total</th><th>Stage</th><th>Due</th><th>Action</th></tr>${orders.slice(0,12).map(x=>`<tr><td>${esc(x.order_no)}</td><td><b>${esc(x.customers?.name||"Unknown customer")}</b></td><td>${esc(x.product)}</td><td>${x.quantity}</td><td>${esc(x.unit||"pcs")}</td><td>${money(x.unit_price)}</td><td><b>${money((Number(x.quantity)||0)*(Number(x.unit_price)||0))}</b></td><td><span class="pill">${esc(x.stage)}</span></td><td>${x.due_date||""}</td><td><button class="btn" onclick="editOrder('${x.id}')">Edit</button></td></tr>`).join("")||`<tr><td colspan="10" class="empty">No orders yet</td></tr>`}</table></div>`;
}
async function orders(){
 try{
  const r=await db.from("orders").select("*,customers(name)").order("created_at",{ascending:false});
  if(r.error)throw r.error;
  content.innerHTML=`<div class="bar"><button class="btn" onclick="newOrder()">+ New Order</button><button class="btn" style="background:#f0c060;color:#101827" onclick="openMark()">🧠 Ask MARK</button></div><div class="tablewrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Service</th><th>Product</th><th>Qty</th><th>Unit</th><th>Unit Price</th><th>Total</th><th>Paid</th><th>Balance</th><th>Stage</th><th>Due</th><th>Priority</th><th>Action</th></tr>${(r.data||[]).map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),paid=Number(x.paid)||0,balance=Math.max(0,total-paid);return `<tr><td>${esc(x.order_no)}</td><td><b>${esc(x.customers?.name||"Unknown")}</b></td><td>${esc(x.service||"")}</td><td>${esc(x.product)}</td><td>${x.quantity}</td><td>${esc(x.unit||"pcs")}</td><td>${money(x.unit_price)}</td><td><b>${money(total)}</b></td><td>${money(paid)}</td><td><b>${money(balance)}</b></td><td>${esc(x.stage||"")}</td><td>${x.due_date||""}</td><td>${esc(x.priority||"Normal")}</td><td><button class="btn" onclick="editOrder('${x.id}')">Edit</button> <button class="btn" onclick="recordPayment('${x.id}')">Record Payment</button> <button class="btn danger" onclick="deleteRow('orders','${x.id}','order')">Delete</button></td></tr>`}).join("")||`<tr><td colspan="14" class="empty">No orders yet</td></tr>`}</table></div>`;
 }catch(e){console.error(e);alert("Unable to load orders: "+(e.message||e));}
}

async function salesactivity(){
 try{
  const r=await db.from("sales_activities").select("*,customers(name)").order("created_at",{ascending:false});
  if(r.error)throw r.error;
  const rows=r.data||[],calls=rows.filter(x=>x.activity_type==="Call").length,wa=rows.filter(x=>x.activity_type==="WhatsApp").length,today=new Date().toISOString().slice(0,10),followups=rows.filter(x=>x.follow_up_date===today).length;
  content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Calls logged</div><div class="metric">${calls}</div></div><div class="card"><div class="muted">WhatsApp logged</div><div class="metric">${wa}</div></div><div class="card"><div class="muted">Follow-ups today</div><div class="metric">${followups}</div></div><div class="card"><div class="muted">Total interactions</div><div class="metric">${rows.length}</div></div></div><div class="bar"><button class="btn" onclick="newSalesActivity('Call')">+ Log Sales Call</button><button class="btn" onclick="newSalesActivity('WhatsApp')">+ Log WhatsApp</button></div><div class="tablewrap"><table class="table"><tr><th>Type</th><th>Customer</th><th>Direction</th><th>Outcome</th><th>Follow-up</th><th>Notes</th><th>Time</th><th>Action</th></tr>${rows.map(x=>`<tr><td><span class="pill">${esc(x.activity_type)}</span></td><td><b>${esc(x.customers?.name||"Unknown customer")}</b></td><td>${esc(x.direction)}</td><td>${esc(x.outcome)}</td><td>${x.follow_up_date||""}</td><td>${esc(x.notes)}</td><td>${new Date(x.created_at).toLocaleString()}</td><td><button class="btn" onclick="editSalesActivity('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRow('sales_activities','${x.id}','sales activity')">Delete</button></td></tr>`).join("")||`<tr><td colspan="8" class="empty">No sales calls or WhatsApp interactions logged yet</td></tr>`}</table></div>`;
 }catch(e){console.error(e);alert("Unable to load sales log: "+(e.message||e));}
}

async function newSalesActivity(type){
 const c=await db.from("customers").select("id,name").order("name");
 modal(type==="Call"?"Log Sales Call":"Log WhatsApp Message",
 `<label>Customer<select id="saCustomer">${(c.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
 <label>Direction<select id="saDirection"><option>Outbound</option><option>Inbound</option></select></label>
 <label>Outcome<input id="saOutcome" placeholder="Interested, no answer, requested quote..."></label>
 <label>Follow-up Date<input id="saFollow" type="date"></label>
 <label>Notes<textarea id="saNotes" placeholder="What was discussed?"></textarea></label>
 <input id="saType" type="hidden" value="${type}">`,
 "saveSalesActivity()");
}
async function saveSalesActivity(){
 const r=await db.from("sales_activities").insert({
   staff_id:user.id,
   customer_id:saCustomer.value,
   activity_type:saType.value,
   direction:saDirection.value,
   outcome:saOutcome.value,
   notes:saNotes.value,
   follow_up_date:saFollow.value||null
 });
 if(r.error)return alert(r.error.message);
 document.querySelector(".modalback").remove();
 salesactivity();
}
async function production(){
 const r=await db.from("production_updates").select("*,orders(order_no,product,quantity,customer_id,customers(name))").order("created_at",{ascending:false});

async function staff(){
 const [r,rr]=await Promise.all([db.from("profiles").select("*").order("created_at"),db.from("erp_roles").select("name").eq("active",true).order("name")]);
 const roles=rr.data||[];
 content.innerHTML=`<div class="bar"><button class="btn" onclick="newStaff()">+ Add Staff</button></div><div class="card"><b>Staff access</b><p class="muted">Authorized operational roles can view active staff for order assignment. Management can assign roles. Tailor and Finisher are production-only personnel records and do not get ERP module access.</p></div>
 <div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
 ${(r.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td><select id="role_${x.id}" ${x.id===user.id?"disabled":""}>${roles.map(z=>`<option value="${esc(z.name)}" ${z.name===x.role?"selected":""}>${esc(z.name)}</option>`).join("")}</select></td><td>${x.active?"Active":"Inactive"}</td><td>${x.id===user.id?"Current":`<button class="btn" onclick="editStaff('${x.id}')">Edit</button> <button class="btn" onclick="saveStaffRole('${x.id}','${esc(x.role)}')">Save</button> <button class="btn gray" onclick="resetStaffPassword('${x.id}','${esc(x.full_name)}')">Reset Password</button> <button class="btn gray" onclick="changeStaffName('${x.id}','${esc(x.full_name)}')">Change Name</button> <button class="btn gray" onclick="changeStaffEmail('${x.id}','${esc(x.full_name)}','${esc(x.email)}')">Change Email</button> <button class="btn danger" onclick="deleteStaffAccount('${x.id}','${esc(x.full_name)}')">Delete</button>`}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">No staff profiles yet</td></tr>`}</table></div>`;

async function editStaff(id){const r=await db.from("profiles").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);const rr=await db.from("erp_roles").select("name").eq("active",true).order("name");modal("Edit Staff",`<label>Full name<input id="eSName" value="${esc(r.data.full_name)}"></label><label>Role<select id="eSRole">${(rr.data||[]).map(x=>`<option ${x.name===r.data.role?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label><label>Active<select id="eSActive"><option value="true" ${r.data.active?"selected":""}>Active</option><option value="false" ${!r.data.active?"selected":""}>Inactive</option></select></label>`,`saveStaffEdit('${id}')`)}
async function saveStaffEdit(id){
 const name=eSName.value.trim();
 if(!name)return alert("Name cannot be empty.");
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Management session expired. Sign in again.");
 const nr=await fetch(SUPABASE_URL+"/functions/v1/admin-change-staff-name",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({user_id:id,full_name:name})});
 const no=await nr.json();
 if(!nr.ok)return alert(no.error||"Unable to change staff name.");
 const r=await db.from("profiles").update({role:eSRole.value,active:eSActive.value==="true"}).eq("id",id);
 if(r.error)return alert("Name changed, but role/status could not be saved: "+r.error.message);
 document.querySelector(".modalback").remove();
 await staff();
}
async function newStaff(){
 const rr=await db.from("erp_roles").select("name").eq("active",true).order("name");
 const roles=rr.data||[];
 modal("Add Staff",`<label>Full name<input id="sName"></label><label>Email<input id="sEmail" type="email"></label><label>Temporary password<input id="sPassword" type="password"></label><label>Role<select id="sRole">${roles.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join("")}</select></label><p class="muted">Use a temporary password and ask the staff member to change it after first login.</p>`,"createStaff()");
}
async function createStaff(){
 const body={full_name:sName.value.trim(),email:sEmail.value.trim(),password:sPassword.value,role:sRole.value};
 if(!body.full_name||!body.email||!body.password||!body.role)return alert("Complete all fields.");
 const {data:{session}}=await db.auth.getSession();
 if(!session)return alert("Management session expired. Sign in again.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/admin-create-staff",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify(body)});
 const out=await r.json();
 if(!r.ok)return alert(out.error||"Unable to create staff.");
 document.querySelector(".modalback").remove();staff();
}
async function saveStaffRole(id,oldRole){
 const value=document.getElementById("role_"+id).value;
 if(value===oldRole)return;
 if(!confirm("Change this staff member's role to "+value+"?"))return;
 const r=await db.from("profiles").update({role:value,active:true}).eq("id",id);
 if(r.error)return alert(r.error.message);
 await db.from("erp_role_change_log").insert({changed_by:user.id,target_user:id,old_role:oldRole,new_role:value});
 staff();
}

async function editRole(id){
 const rr=await db.from("erp_roles").select("name,description").eq("id",id).single();

async function savePermissions(id){
 const values=[...document.querySelectorAll(".permcheck:checked")].map(x=>x.value);
 await db.from("erp_role_permissions").delete().eq("role_id",id);
 if(values.length){const r=await db.from("erp_role_permissions").insert(values.map(permission=>({role_id:id,permission})));if(r.error)return alert(r.error.message)}
 document.querySelector(".modalback").remove();roles();
}

async function askMark(question){
 const result=document.getElementById("dashboardMarkResult");if(result)result.innerHTML='<div class="mark-result">🧠 MARK is reviewing the live ERP...</div>';openMark(question);
}
async function callMark(question){
 const out=document.getElementById("markMessages");if(!out)return;
 out.insertAdjacentHTML("beforeend",`<div class="mark-msg mark-user">${esc(question)}</div>`);
 const loading=document.createElement("div");loading.className="mark-msg mark-ai";loading.textContent="🧠 MARK is checking the ERP...";out.appendChild(loading);out.scrollTop=out.scrollHeight;
 try{const {data:{session}}=await db.auth.getSession();if(!session){loading.textContent="Session expired. Please sign in again.";return}
 const r=await fetch(SUPABASE_URL+"/functions/v1/mark-business-manager",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY},body:JSON.stringify({question})});const data=await r.json();loading.textContent=data.answer||data.error||"MARK could not respond.";const d=document.getElementById("dashboardMarkResult");if(d)d.innerHTML='<div class="mark-result">'+esc(data.answer||data.error||"MARK could not respond.")+'</div>';
 }catch(e){loading.textContent="MARK connection error: "+e.message}out.scrollTop=out.scrollHeight;
}
function openMark(initial=""){
 const existing=document.querySelector(".mark-modal-back");if(existing){if(initial)callMark(initial);return}
 const wrap=document.createElement("div");wrap.className="modalback mark-modal-back";wrap.innerHTML=`<div class="modal mark-modal"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#b07d16">AI BUSINESS MANAGER</div><h2 style="margin:2px 0">🧠 MARK</h2><div class="muted">Your factory's day-to-day business manager.</div></div><button class="btn gray" onclick="this.closest('.mark-modal-back').remove()">Close</button></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0"><button class="mark-chip" onclick="callMark('Give me my factory morning brief. Top priorities, bottlenecks, procurement blockers, money to collect and deliveries.')">Morning Brief</button><button class="mark-chip" onclick="callMark('What is urgent right now?')">Urgent</button><button class="mark-chip" onclick="callMark('Which orders are at risk of missing their due dates?')">Production Risk</button><button class="mark-chip" onclick="callMark('Who owes us money and who should we follow up with first?')">Outstanding</button><button class="mark-chip" onclick="callMark('What procurement problems could stop production?')">Procurement</button><button class="mark-chip" onclick="callMark('How is the factory performing today and what should management focus on?')">Management</button></div><div id="markMessages" style="min-height:180px;max-height:48vh;overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:8px"></div><div class="mark-input"><textarea id="markInput" placeholder="Ask MARK about the factory..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMark()}" rows="2"></textarea><button class="btn" style="background:#f0c060;color:#101827;font-weight:800" onclick="sendMark()">Ask</button></div></div>`;document.body.appendChild(wrap);if(initial)callMark(initial);
}
function sendMark(){const input=document.getElementById("markInput");const q=input.value.trim();if(!q)return;input.value="";callMark(q)}
function modal(title,body,saveFn){

 wrap.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="actions"><button class="btn gray" onclick="this.closest('.modalback').remove()">Cancel</button><button class="btn" onclick="${saveFn}">Save</button></div></div>`;
 document.body.appendChild(wrap);
}

 content.innerHTML=`<div class="bar"><button class="btn" onclick="newProduction()">+ Production Task</button></div><div class="card"><h3>Assigned Production Work</h3><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Item</th><th>Qty</th><th>Stage</th><th>Assigned To</th><th>Status</th><th>Action</th></tr>${(t.data||[]).map(x=>`<tr><td><b>${esc(x.orders?.customers?.name||"Unknown")}</b></td><td>${esc(x.orders?.order_no||"")}</td><td>${esc(x.item_name)}</td><td>${x.quantity} ${esc(x.unit)}</td><td>${esc(x.stage)}</td><td>${esc(x.profiles?.full_name||"Unassigned")}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="editProductionTask('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRow('order_production_items','${x.id}','production task')">Delete</button></td></tr>`).join("")||`<tr><td colspan="8" class="empty">No production tasks assigned yet</td></tr>`}</table></div></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Product</th><th>Stage</th><th>Completed</th><th>Status</th><th>Updated</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td><b>${esc(x.orders?.customers?.name||"Unknown customer")}</b></td><td>${esc(x.orders?.order_no)}</td><td>${esc(x.orders?.product)}</td><td>${esc(x.stage)}</td><td>${x.completed_qty}/${x.orders?.quantity} ${esc(x.orders?.unit||"pcs")}</td><td>${esc(x.status)}</td><td>${new Date(x.created_at).toLocaleString()}</td><td><button class="btn" onclick="editProduction('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRow('production_updates','${x.id}','production update')">Delete</button></td></tr>`).join("")||`<tr><td colspan="8" class="empty">No production updates yet</td></tr>`}</table></div>`;
}
async function editProductionTask(id){const r=await db.from("order_production_items").select("*").eq("id",id).single();if(r.error)return alert(r.error.message);const [o,staff]=await Promise.all([db.from("orders").select("id,order_no,product,customers(name)").order("created_at",{ascending:false}),db.from("profiles").select("id,full_name,role").eq("active",true).order("full_name")]);modal("Edit Production Task",`<label>Order<select id="etOrder">${(o.data||[]).map(x=>`<option value="${x.id}" ${x.id===r.data.order_id?"selected":""}>${esc(x.customers?.name||"Unknown")} · ${x.order_no} · ${esc(x.product)}</option>`).join("")}</select></label><label>Production Item<select id="etItem">${["Senator Top","Senator Trouser","Shirt","Trouser","Jacket","Gown","Finishing","Other"].map(v=>`<option ${v===r.data.item_name?"selected":""}>${v}</option>`).join("")}</select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Quantity<input id="etQty" type="number" value="${r.data.quantity}"></label><label>Unit<select id="etUnit">${["pcs","pair","package"].map(v=>`<option ${v===r.data.unit?"selected":""}>${v}</option>`).join("")}</select></label></div><label>Stage<select id="etStage">${stageOptions(r.data.stage)}</select></label><label>Assign To<select id="etAssigned"><option value="">Unassigned</option>${(staff.data||[]).filter(x=>["Tailor","Finisher"].includes(x.role)).map(x=>`<option value="${x.id}" ${x.id===r.data.assigned_to?"selected":""}>${esc(x.full_name)} · ${esc(x.role)}</option>`).join("")}</select></label><label>Status<select id="etStatus">${["Pending","In Progress","Completed","Rework"].map(v=>`<option ${v===r.data.status?"selected":""}>${v}</option>`).join("")}</select></label><label>Notes<textarea id="etNotes">${esc(r.data.notes||"")}</textarea></label>`,`saveProductionTaskEdit('${id}')`)}
async function saveProductionTaskEdit(id){const r=await db.from("order_production_items").update({order_id:etOrder.value,item_name:etItem.value,quantity:+etQty.value,unit:etUnit.value,stage:etStage.value,assigned_to:etAssigned.value||null,status:etStatus.value,notes:etNotes.value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return alert(r.error.message);document.querySelector(".modalback").remove();production()}

async function newPayment(preselectedOrder){
 const o=await db.from("orders").select("id,order_no,quantity,unit_price,paid,customers(name)").order("created_at",{ascending:false});
 if(o.error)return alert(o.error.message);
 modal("Record Payment",`<label>Customer / Order<select id="payOrder">${(o.data||[]).map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),bal=Math.max(0,total-(Number(x.paid)||0));return `<option value="${x.id}" ${x.id===preselectedOrder?"selected":""}>${esc(x.customers?.name||"Unknown")} · ${esc(x.order_no)} · Balance ${money(bal)}</option>`}).join("")}</select></label><label>Amount<input id="payAmount" type="number" min="0" step="0.01"></label><label>Method<select id="payMethod"><option>Transfer</option><option>Cash</option><option>POS</option><option>Card</option></select></label><label>Payment Date<input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>`,"savePayment()");
}

/* Final relationship-safe loaders. The database does not expose recorded_by/inspected_by
   as PostgREST relationships, so names are resolved through profiles separately. */
async function payments(){
 try{
  const r=await db.from("payments").select("*,orders(order_no,product,quantity,unit,unit_price,paid,customers(name))").order("created_at",{ascending:false});
  if(r.error)throw r.error;
  const rows=r.data||[];
  const ids=[...new Set(rows.map(x=>x.recorded_by).filter(Boolean))];
  let names={};
  if(ids.length){
   const p=await db.from("profiles").select("id,full_name").in("id",ids);
   if(p.error)throw p.error;
   names=Object.fromEntries((p.data||[]).map(x=>[x.id,x.full_name]));
  }
  content.innerHTML=`<div class="bar"><button class="btn" onclick="newPayment()">+ Record Payment</button></div><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Order</th><th>Total</th><th>Payment</th><th>Balance</th><th>Method</th><th>Recorded By</th></tr>${rows.map(x=>{
   const total=(Number(x.orders?.quantity)||0)*(Number(x.orders?.unit_price)||0);
   const paid=Number(x.orders?.paid)||0;
   const balance=Math.max(0,total-paid);
   return `<tr><td>${x.paid_on||""}</td><td><b>${esc(x.orders?.customers?.name||"Unknown customer")}</b></td><td>${esc(x.orders?.order_no||"")}</td><td>${money(total)}</td><td><b>${money(x.amount)}</b></td><td>${money(balance)}</td><td>${esc(x.method||"")}</td><td>${esc(names[x.recorded_by]||"")}</td></tr>`;
  }).join("")||`<tr><td colspan="8" class="empty">No payments recorded yet</td></tr>`}</table></div>`;
 }catch(e){console.error(e);alert("Unable to load payments: "+(e.message||e));}
}

  const ids=[...new Set(rows.map(x=>x.inspected_by).filter(Boolean))];

   const p=await db.from("profiles").select("id,full_name").in("id",ids);
   if(p.error)throw p.error;

 }catch(e){console.error(e);alert("Unable to load QA/QC: "+(e.message||e));}
}

async function savePayment(){
 const amount=Number(payAmount.value||0);
 if(amount<=0)return alert("Enter a valid payment amount.");
 const o=await db.from("orders").select("id,quantity,unit_price,paid").eq("id",payOrder.value).single();
 if(o.error)return alert("Unable to load order: "+o.error.message);
 const total=(Number(o.data.quantity)||0)*(Number(o.data.unit_price)||0);
 const current=Number(o.data.paid)||0;
 const balance=Math.max(0,total-current);
 if(amount>balance)return alert("Payment cannot exceed the outstanding balance of "+money(balance)+".");
 const r=await db.from("payments").insert({order_id:payOrder.value,amount,method:payMethod.value,paid_on:payDate.value,recorded_by:user.id});
 if(r.error)return alert("Unable to record payment: "+r.error.message);
 const u=await db.from("orders").update({paid:current+amount}).eq("id",payOrder.value);
 if(u.error)return alert("Payment recorded, but order balance could not be updated: "+u.error.message);
 document.querySelector(".modalback")?.remove();
 await payments();
}
