function render(){if(!user){root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand">MARKCHARLES GARMENT FACTORY</div><h1 style="margin-top:8px">ERP Login</h1><p class="muted">Sign in with your assigned staff account.</p><label>Email<input id="loginEmail" type="email"></label><label>Password<input id="loginPassword" type="password"></label><button class="btn" style="width:100%" onclick="signIn()">Sign in</button><div id="loginErr" class="error"></div></div></div>`;return}if(!profile||!profile.active||profile.role==="Pending"){root.innerHTML=`<div class="login"><div class="loginbox"><h2>Account not ready</h2><p>Your account has not been assigned an active ERP role.</p><button class="btn gray" onclick="signOut()">Sign out</button></div></div>`;return}root.innerHTML=`<div class="app"><aside class="side"><h2>MARKCHARLES</h2><small>Garment Factory ERP</small><div id="nav"></div><button class="navbtn logout" onclick="signOut()">↪ <span>Log out</span></button></aside><main class="main"><div class="top"><div><h1 id="pageTitle"></h1><div class="muted">${esc(profile.full_name)} · ${esc(profile.role)}</div></div><span class="pill green">Cloud connected</span></div><div id="content"></div></main></div>`;buildNav();go(view)}

async function go(v){if(!can(v))v="dashboard";view=v;buildNav();pageTitle.textContent={dashboard:"Factory Dashboard",orders:"Orders",salesactivity:"Sales Calls & WhatsApp",production:"Live Production",procurement:"Procurement",inventory:"Store / Inventory",qa:"QA / QC",customers:"Customers",payments:"Payments",staff:"Staff",roles:"Roles & Permissions",audit:"Audit Log"}[v];try{await ({dashboard,orders,salesactivity,production,procurement,inventory,qa,customers,payments,staff,roles,audit}[v])()}catch(e){console.error(e);content.innerHTML=`<div class="card"><b>Unable to load ${esc(v)}</b><p class="error">${esc(e.message||e)}</p></div>`}}
async function getCustomers(){const r=await db.from("customers").select("id,name,type,phone,email").order("name");if(r.error)throw r.error;return r.data||[]}
async function getOrders(){const r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)throw r.error;return r.data||[]}
async function paymentTotals(){const r=await db.from("payments").select("order_id,amount");if(r.error)throw r.error;const m={};(r.data||[]).forEach(x=>m[x.order_id]=(m[x.order_id]||0)+(Number(x.amount)||0));return m}
async function dashboard(){const [orders,customers,payments,prod,proc,qaRows,sales,inv]=await Promise.all([getOrders(),getCustomers(),db.from("payments").select("*").order("created_at",{ascending:false}),db.from("order_production_items").select("*").order("created_at",{ascending:false}).limit(50),db.from("procurement_requests").select("*").order("created_at",{ascending:false}).limit(50),db.from("qa_inspections").select("*").order("created_at",{ascending:false}).limit(50),db.from("sales_activities").select("*").order("created_at",{ascending:false}).limit(50),db.from("inventory_items").select("*")]);const cmap=Object.fromEntries(customers.map(x=>[x.id,x.name])),pmap={};(payments.data||[]).forEach(x=>pmap[x.order_id]=(pmap[x.order_id]||0)+Number(x.amount||0));const active=orders.filter(x=>x.stage!=="Completed"),value=orders.reduce((s,x)=>s+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0),outstanding=orders.reduce((s,x)=>s+Math.max(0,(Number(x.quantity)||0)*(Number(x.unit_price)||0)-(pmap[x.id]||0)),0),low=(inv.data||[]).filter(x=>Number(x.stock)<=Number(x.reorder_level)).length;const today=new Date(),days=d=>d?Math.ceil((new Date(d+"T23:59:59")-today)/86400000):999,overdue=active.filter(x=>days(x.due_date)<0).length,risk=active.filter(x=>days(x.due_date)>=0&&days(x.due_date)<=3).length;const activity=[];orders.slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Order created",text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.product||"Order"} · ${x.order_no}`}));(payments.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Payment recorded",text:`${money(x.amount)} · ${x.method||""}`}));(prod.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Production task",text:`${x.item_name||"Item"} · ${x.stage||""}`}));(proc.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Procurement request",text:`${x.item||"Material"} · ${money(x.amount)}`}));(qaRows.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"QA/QC inspection",text:`${x.status||""} · ${x.measurement||""}`}));(sales.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:`${x.activity_type||"Sales"} logged`,text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.outcome||""}`}));activity.sort((a,b)=>new Date(b.t)-new Date(a.t));content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Active Orders</div><div class="metric">${active.length}</div></div><div class="card"><div class="muted">Pipeline Value</div><div class="metric">${money(value)}</div></div><div class="card"><div class="muted">Outstanding Balance</div><div class="metric" style="color:#b42318">${money(outstanding)}</div></div><div class="card"><div class="muted">At Risk / Overdue</div><div class="metric">${risk} / ${overdue}</div></div></div><div class="markbar"><h3>Factory Snapshot</h3><p>Everything important happening in the ERP is summarized here.</p><div class="grid">${STAGES.map(s=>{const n=orders.filter(x=>(x.stage||"Procurement")===s).length;return `<div class="card" style="margin:0"><div class="metric">${n}</div><b>${s}</b></div>`}).join("")}</div></div><div class="grid"><div class="card"><div class="muted">Production Tasks</div><div class="metric">${(prod.data||[]).length}</div></div><div class="card"><div class="muted">Pending Procurement</div><div class="metric">${(proc.data||[]).filter(x=>!['Received','Rejected'].includes(x.status)).length}</div></div><div class="card"><div class="muted">QA/QC Inspections</div><div class="metric">${(qaRows.data||[]).length}</div></div><div class="card"><div class="muted">Low Stock Items</div><div class="metric">${low}</div></div></div><div class="card"><h3>Recent Activity</h3>${activity.slice(0,25).map(a=>`<div class="activity"><span class="dot"></span><div><b>${esc(a.title)}</b><div>${esc(a.text)}</div><div class="muted">${new Date(a.t).toLocaleString()}</div></div></div>`).join("")||'<div class="empty">No activity yet</div>'}</div><div class="card"><h3>Orders & Balances</h3><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Product</th><th>Total</th><th>Paid</th><th>Balance</th><th>Stage</th></tr>${orders.slice(0,15).map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),paid=pmap[x.id]||0;return `<tr><td><b>${esc(cmap[x.customer_id]||"Unknown customer")}</b></td><td>${esc(x.order_no)}</td><td>${esc(x.product)}</td><td>${money(total)}</td><td>${money(paid)}</td><td><b>${money(Math.max(0,total-paid))}</b></td><td>${esc(x.stage||"")}</td></tr>`}).join("")||'<tr><td colspan="7" class="empty">No orders yet</td></tr>'}</table></div></div>`}
async function orders(){const [rows,customers,pmap]=await Promise.all([getOrders(),getCustomers(),paymentTotals()]);const cmap=Object.fromEntries(customers.map(x=>[x.id,x.name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newOrder()">+ New Order</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Service</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Paid</th><th>Balance</th><th>Stage</th><th>Due</th><th>Action</th></tr>${rows.map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),paid=pmap[x.id]||0;return `<tr><td><b>${esc(cmap[x.customer_id]||"Unknown customer")}</b></td><td>${esc(x.order_no)}</td><td>${esc(x.service||"")}</td><td>${esc(x.product)}</td><td>${x.quantity} ${esc(x.unit||"pcs")}</td><td>${money(x.unit_price)}</td><td><b>${money(total)}</b></td><td>${money(paid)}</td><td><b>${money(Math.max(0,total-paid))}</b></td><td>${esc(x.stage||"")}</td><td>${x.due_date||""}</td><td><button class="btn" onclick="editOrder('${x.id}')">Edit</button> <button class="btn" onclick="recordPayment('${x.id}')">Record Payment</button> <button class="btn danger" onclick="deleteRecord('orders','${x.id}','order')">Delete</button></td></tr>`}).join("")||'<tr><td colspan="12" class="empty">No orders yet</td></tr>'}</table></div>`}
async function newOrder(){try{const [c,s]=await Promise.all([getCustomers(),db.from("profiles").select("id,full_name,role").eq("active",true).order("full_name")]);if(!c.length)return toast("Create a customer first before creating an order.");modal("New Order",`<label>Customer<select id="oCustomer">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label><label>Service<select id="oService">${["Wholesale","Corporate","R2W","Bespoke","School Uniform","Hotel Uniform","Wedding"].map(x=>`<option>${x}</option>`).join("")}</select></label><label>Product<input id="oProduct" placeholder="Senator, shirt, suit..."></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Quantity<input id="oQty" type="number" min="1" value="1" oninput="calc('oQty','oPrice','oTotal')"></label><label>Unit<select id="oUnit"><option>pcs</option><option>pair</option><option>package</option><option>yard</option></select></label></div><label>Unit Price<input id="oPrice" type="number" min="0" oninput="calc('oQty','oPrice','oTotal')"></label><label>Total Amount<input id="oTotal" readonly value="₦0"></label><label>Initial Payment (optional)<input id="oInitialPayment" type="number" min="0" value="0"></label><label>Payment Method<select id="oPaymentMethod"><option>Transfer</option><option>Cash</option><option>POS</option><option>Card</option></select></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Stage<select id="oStage">${stageOptions()}</select></label><label>Due Date<input id="oDue" type="date"></label></div><label>Priority<select id="oPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Assigned Staff<select id="oAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.full_name)} · ${esc(x.role)}</option>`).join("")}</select></label><label>Fabric<input id="oFabric"></label><label>Measurements / Sizes<textarea id="oMeasurements"></textarea></label><label>Notes<textarea id="oNotes"></textarea></label>`,'saveOrder()')}catch(e){toast("Unable to open New Order: "+e.message)}}
function calc(q,p,t){const qv=Number(document.getElementById(q)?.value||0),pv=Number(document.getElementById(p)?.value||0),el=document.getElementById(t);if(el)el.value=money(qv*pv)}
async function saveOrder(){const qty=Number(oQty.value||0),price=Number(oPrice.value||0),total=qty*price,initial=Number(oInitialPayment.value||0);if(!oCustomer.value||!oProduct.value.trim()||qty<=0||price<=0)return toast("Select a customer and enter product, quantity and unit price.");if(initial<0||initial>total)return toast("Initial payment cannot be more than the order total.");const r=await db.from("orders").insert({order_no:"MC-"+Date.now().toString().slice(-7),customer_id:oCustomer.value,service:oService.value,product:oProduct.value.trim(),quantity:qty,unit:oUnit.value,unit_price:price,due_date:oDue.value||null,stage:oStage.value,priority:oPriority.value,assigned_to:oAssigned.value||null,fabric:oFabric.value,measurements:oMeasurements.value,notes:oNotes.value,created_by:user.id}).select("id").single();if(r.error)return toast(r.error.message);await db.from("production_updates").insert({order_id:r.data.id,stage:oStage.value,completed_qty:0,status:"In Progress",notes:"Order created",updated_by:user.id});if(initial>0){const pr=await db.from("payments").insert({order_id:r.data.id,amount:initial,method:oPaymentMethod.value,paid_on:new Date().toISOString().slice(0,10),recorded_by:user.id});if(pr.error)console.warn(pr.error.message)}await logActivity("Order created",`Order ${r.data.id} created`);document.querySelector('.modalback')?.remove();orders()}
async function editOrder(id){const [r,c,s]=await Promise.all([db.from("orders").select("*").eq("id",id).single(),getCustomers(),db.from("profiles").select("id,full_name,role").eq("active",true).order("full_name")]);if(r.error)return toast(r.error.message);modal("Edit Order",`<label>Customer<select id="eCustomer">${c.map(x=>`<option value="${x.id}" ${x.id===r.data.customer_id?'selected':''}>${esc(x.name)}</option>`).join("")}</select></label><label>Service<select id="eService">${["Wholesale","Corporate","R2W","Bespoke","School Uniform","Hotel Uniform","Wedding"].map(x=>`<option ${x===(r.data.service||'R2W')?'selected':''}>${x}</option>`).join("")}</select></label><label>Product<input id="eProduct" value="${esc(r.data.product)}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Quantity<input id="eQty" type="number" min="1" value="${r.data.quantity}" oninput="calc('eQty','ePrice','eTotal')"></label><label>Unit<select id="eUnit">${['pcs','pair','package','yard'].map(x=>`<option ${x===(r.data.unit||'pcs')?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Unit Price<input id="ePrice" type="number" value="${r.data.unit_price}" oninput="calc('eQty','ePrice','eTotal')"></label><label>Total Amount<input id="eTotal" readonly value="${money((Number(r.data.quantity)||0)*(Number(r.data.unit_price)||0))}"></label><label>Stage<select id="eStage">${stageOptions(r.data.stage)}</select></label><label>Due Date<input id="eDue" type="date" value="${r.data.due_date||''}"></label><label>Priority<select id="ePriority">${['Normal','High','Urgent'].map(x=>`<option ${x===(r.data.priority||'Normal')?'selected':''}>${x}</option>`).join('')}</select></label><label>Assigned Staff<select id="eAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}" ${x.id===r.data.assigned_to?'selected':''}>${esc(x.full_name)} · ${esc(x.role)}</option>`).join('')}</select></label><label>Fabric<input id="eFabric" value="${esc(r.data.fabric||'')}"></label><label>Measurements / Sizes<textarea id="eMeasurements">${esc(r.data.measurements||'')}</textarea></label><label>Notes<textarea id="eNotes">${esc(r.data.notes||'')}</textarea></label>`,`saveOrderEdit('${id}')`)}
async function saveOrderEdit(id){const r=await db.from("orders").update({customer_id:eCustomer.value,service:eService.value,product:eProduct.value,quantity:+eQty.value,unit:eUnit.value,unit_price:+ePrice.value,stage:eStage.value,due_date:eDue.value||null,priority:ePriority.value,assigned_to:eAssigned.value||null,fabric:eFabric.value,measurements:eMeasurements.value,notes:eNotes.value,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)return toast(r.error.message);await logActivity("Order updated",`Order ${id} updated`);document.querySelector('.modalback')?.remove();orders()}
async function recordPayment(orderId){const [o,p,c]=await Promise.all([db.from("orders").select("id,order_no,customer_id,quantity,unit_price").eq("id",orderId).single(),db.from("payments").select("amount").eq("order_id",orderId),getCustomers()]);if(o.error)return toast(o.error.message);const cm=Object.fromEntries(c.map(x=>[x.id,x.name])),paid=(p.data||[]).reduce((s,x)=>s+Number(x.amount||0),0),total=(Number(o.data.quantity)||0)*(Number(o.data.unit_price)||0),balance=Math.max(0,total-paid);if(balance<=0)return toast("This order has no outstanding balance.");modal("Record Payment",`<div class="card" style="margin-bottom:12px"><b>${esc(cm[o.data.customer_id]||'Unknown customer')}</b><div class="muted">Order ${esc(o.data.order_no)} · Outstanding ${money(balance)}</div></div><label>Payment Amount<input id="payAmount" type="number" min="1" max="${balance}" value="${balance}"></label><label>Method<select id="payMethod"><option>Transfer</option><option>Cash</option><option>POS</option><option>Card</option></select></label><label>Paid On<input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>`,`savePayment('${orderId}')`)}
async function savePayment(orderId){const amount=Number(payAmount.value||0);if(amount<=0)return toast("Enter a valid payment amount.");const r=await db.from("payments").insert({order_id:orderId,amount,method:payMethod.value,paid_on:payDate.value||null,recorded_by:user.id});if(r.error)return toast(r.error.message);await logActivity("Payment recorded",`${money(amount)} recorded for order ${orderId}`);document.querySelector('.modalback')?.remove();payments()}

async function editCustomer(id){const r=await db.from('customers').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Customer',`<label>Name<input id="ecName" value="${esc(r.data.name||'')}"></label><label>Type<select id="ecType">${['Corporate','Wholesale','Retail','School','Hotel','Bespoke','Wedding'].map(x=>`<option ${x===r.data.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Phone<input id="ecPhone" value="${esc(r.data.phone||'')}"></label><label>Email<input id="ecEmail" value="${esc(r.data.email||'')}"></label><label>Address<textarea id="ecAddress">${esc(r.data.address||'')}</textarea></label>`,`saveCustomerEdit('${id}')`)}
async function saveCustomerEdit(id){const r=await db.from('customers').update({name:ecName.value,type:ecType.value,phone:ecPhone.value,email:ecEmail.value,address:ecAddress.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Customer updated',ecName.value);document.querySelector('.modalback')?.remove();customers()}
async function inventory(){const r=await db.from('inventory_items').select('*').order('name');content.innerHTML=`<div class="bar"><button class="btn" onclick="newInventory()">+ Add Item</button><button class="btn" onclick="receiveStock()">↙ Receive Stock</button><button class="btn" onclick="issueAccessory()">↗ Issue Accessory</button><button class="btn gray" onclick="returnAccessory()">↩ Collect / Return</button></div><div class="tablewrap"><table class="table"><tr><th>Code</th><th>Item</th><th>Category</th><th>Stock</th><th>Unit</th><th>Reorder</th><th>Unit Cost</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.code||'')}</td><td>${esc(x.name)}</td><td>${esc(x.category||'')}</td><td>${x.stock}</td><td>${esc(x.unit||'')}</td><td>${x.reorder_level}</td><td>${money(x.unit_cost)}</td><td><button class="btn" onclick="editInventory('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('inventory_items','${x.id}','inventory item')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No inventory items yet</td></tr>'}</table></div>`}
async function newInventory(){modal('Add Inventory Item',`<label>Code<input id="niCode"></label><label>Name<input id="niName"></label><label>Category<input id="niCategory"></label><label>Unit<select id="niUnit"><option>yard</option><option>pcs</option><option>pair</option><option>package</option></select></label><label>Opening Stock<input id="niStock" type="number" value="0"></label><label>Reorder Level<input id="niReorder" type="number" value="0"></label><label>Unit Cost<input id="niCost" type="number" value="0"></label>`,'saveInventory()')}
async function saveInventory(){const r=await db.from('inventory_items').insert({code:niCode.value,name:niName.value,category:niCategory.value,unit:niUnit.value,stock:+niStock.value,reorder_level:+niReorder.value,unit_cost:+niCost.value});if(r.error)return toast(r.error.message);await logActivity('Inventory item created',niName.value);document.querySelector('.modalback')?.remove();inventory()}
async function editInventory(id){const r=await db.from('inventory_items').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Inventory Item',`<label>Code<input id="eiCode" value="${esc(r.data.code||'')}"></label><label>Name<input id="eiName" value="${esc(r.data.name||'')}"></label><label>Category<input id="eiCategory" value="${esc(r.data.category||'')}"></label><label>Unit<select id="eiUnit">${['yard','pcs','pair','package'].map(x=>`<option ${x===r.data.unit?'selected':''}>${x}</option>`).join('')}</select></label><label>Stock<input id="eiStock" type="number" value="${r.data.stock||0}"></label><label>Reorder Level<input id="eiReorder" type="number" value="${r.data.reorder_level||0}"></label><label>Unit Cost<input id="eiCost" type="number" value="${r.data.unit_cost||0}"></label>`,`saveInventoryEdit('${id}')`)}
async function saveInventoryEdit(id){const r=await db.from('inventory_items').update({code:eiCode.value,name:eiName.value,category:eiCategory.value,unit:eiUnit.value,stock:+eiStock.value,reorder_level:+eiReorder.value,unit_cost:+eiCost.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Inventory updated',eiName.value);document.querySelector('.modalback')?.remove();inventory()}
async function receiveStock(){const r=await db.from('inventory_items').select('id,name,unit').order('name');modal('Receive Stock',`<label>Item<select id="rsItem">${(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.unit)})</option>`).join('')}</select></label><label>Quantity<input id="rsQty" type="number" min="1"></label>`,'saveReceiveStock()')}
async function saveReceiveStock(){const item=await db.from('inventory_items').select('stock,name').eq('id',rsItem.value).single();if(item.error)return toast(item.error.message);const r=await db.from('inventory_items').update({stock:Number(item.data.stock||0)+Number(rsQty.value||0)}).eq('id',rsItem.value);if(r.error)return toast(r.error.message);await logActivity('Stock received',`${rsQty.value} added to ${item.data.name}`);document.querySelector('.modalback')?.remove();inventory()}
async function issueAccessory(){toast('Accessory issue screen is kept separate from this rebuild until its transaction columns are confirmed.')}
async function returnAccessory(){toast('Collect / Return screen is kept separate from this rebuild until its transaction columns are confirmed.')}
async function staff(){const r=await db.from('profiles').select('*').order('full_name');content.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email||'')}</td><td>${esc(x.role||'')}</td><td>${x.active?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No staff yet</td></tr>'}</table></div>`}
async function roles(){const r=await db.from('erp_roles').select('*').order('name');content.innerHTML=`<div class="card"><h3>Roles & Permissions</h3><p class="muted">Management controls ERP module access.</p>${(r.data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${esc(x.name)}</b><div class="muted">${esc(x.description||'')}</div></div>`).join('')}</div>`}
async function audit(){const r=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(150);content.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.user_id||'')}</td><td>${esc(x.action||'')}</td><td>${esc(x.details||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit entries yet</td></tr>'}</table></div>`}
async function deleteRecord(table,id,label){if(profile?.role!=='Management')return toast('Only Management can delete records.');if(!confirm('Delete '+label+'? This cannot be undone.'))return;const r=await db.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity(`${label} deleted`,id);go(view)}
function modal(title,body,saveFn){const wrap=document.createElement('div');wrap.className='modalback';wrap.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="actions"><button class="btn gray" type="button" onclick="this.closest('.modalback').remove()">Cancel</button><button class="btn" type="button" onclick="${saveFn}">Save</button></div></div>`;document.body.appendChild(wrap)}
async function editPayment(id){const r=await db.from('payments').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const [o,c]=await Promise.all([getOrders(),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));modal('Edit Payment',`<label>Customer / Order<select id="epOrder">${o.map(x=>`<option value="${x.id}" ${x.id===r.data.order_id?'selected':''}>${esc(cm[x.customer_id]||'Unknown')} · ${esc(x.order_no)} · ${esc(x.product)}</option>`).join('')}</select></label><label>Amount<input id="epAmount" type="number" value="${r.data.amount||0}"></label><label>Method<select id="epMethod">${['Transfer','Cash','POS','Card'].map(x=>`<option ${x===r.data.method?'selected':''}>${x}</option>`).join('')}</select></label><label>Paid On<input id="epDate" type="date" value="${r.data.paid_on||''}"></label>`,`savePaymentEdit('${id}')`)}
async function savePaymentEdit(id){const r=await db.from('payments').update({order_id:epOrder.value,amount:+epAmount.value,method:epMethod.value,paid_on:epDate.value||null}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Payment updated',id);document.querySelector('.modalback')?.remove();payments()}
init();
</script>
<script>
(function(){
  const oldStaff = window.staff;
  const oldRoles = window.roles;
  window.staff = async function(){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage staff.');
    const r=await window.db.from('profiles').select('*').order('full_name');
    if(r.error) return window.toast(r.error.message);
    window.content.innerHTML='<div class="bar"><button class="btn" onclick="newStaff()">+ Add Staff</button></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>'+((r.data||[]).map(x=>`<tr><td>${window.esc(x.full_name)}</td><td>${window.esc(x.email||'')}</td><td>${window.esc(x.role||'')}</td><td>${x.active?'Active':'Inactive'}</td><td><button class="btn" onclick="editStaff('${x.id}')">Edit</button> <button class="btn gray" onclick="toggleStaff('${x.id}',${!x.active})">${x.active?'Deactivate':'Activate'}</button> <button class="btn danger" onclick="deleteStaff('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No staff yet</td></tr>')+'</table></div>';
  };
  window.newStaff = async function(){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage staff.');
    const roles=await window.db.from('erp_roles').select('name').eq('active',true).order('name');
    window.modal('Add Staff Profile',`<p class="muted">Create the staff login in Supabase Authentication first, then enter the same User ID here.</p><label>Auth User ID<input id="nsId" placeholder="UUID from Authentication"></label><label>Full Name<input id="nsName"></label><label>Email<input id="nsEmail" type="email"></label><label>Role<select id="nsRole">${(roles.data||[]).map(x=>`<option>${window.esc(x.name)}</option>`).join('')}</select></label><label><input id="nsActive" type="checkbox" checked style="width:auto"> Active</label>`,'saveStaff()');
  };
  window.saveStaff = async function(){
    const r=await window.db.from('profiles').insert({id:nsId.value.trim(),full_name:nsName.value.trim(),email:nsEmail.value.trim(),role:nsRole.value,active:nsActive.checked});
    if(r.error) return window.toast(r.error.message);
    await window.logActivity('Staff profile created',nsName.value); document.querySelector('.modalback')?.remove(); window.staff();
  };
  window.editStaff = async function(id){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage staff.');
    const r=await window.db.from('profiles').select('*').eq('id',id).single(); if(r.error) return window.toast(r.error.message);
    const roles=await window.db.from('erp_roles').select('name').eq('active',true).order('name');
    window.modal('Edit Staff',`<label>Full Name<input id="esName" value="${window.esc(r.data.full_name||'')}"></label><label>Email<input id="esEmail" type="email" value="${window.esc(r.data.email||'')}"></label><label>Role<select id="esRole">${(roles.data||[]).map(x=>`<option ${x.name===r.data.role?'selected':''}>${window.esc(x.name)}</option>`).join('')}</select></label><label><input id="esActive" type="checkbox" ${r.data.active?'checked':''} style="width:auto"> Active</label>`,'saveStaffEdit(\''+id+'\')');
  };
  window.saveStaffEdit = async function(id){
    const r=await window.db.from('profiles').update({full_name:esName.value.trim(),email:esEmail.value.trim(),role:esRole.value,active:esActive.checked}).eq('id',id); if(r.error) return window.toast(r.error.message);
    await window.logActivity('Staff profile updated',esName.value); document.querySelector('.modalback')?.remove(); window.staff();
  };
  window.toggleStaff = async function(id,active){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage staff.');
    const r=await window.db.from('profiles').update({active}).eq('id',id); if(r.error) return window.toast(r.error.message); window.staff();
  };
  window.deleteStaff = async function(id){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage staff.');
    if(id===window.user.id) return window.toast('You cannot delete your own active profile. Deactivate it instead.');
    if(!confirm('Delete this staff profile? The authentication account is not deleted.')) return;
    const r=await window.db.from('profiles').delete().eq('id',id); if(r.error) return window.toast(r.error.message); window.staff();
  };
  window.roles = async function(){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage roles and permissions.');
    const [r,p]=await Promise.all([window.db.from('erp_roles').select('*').order('name'),window.db.from('erp_role_permissions').select('*')]);
    if(r.error) return window.toast(r.error.message); if(p.error) return window.toast(p.error.message);
    const by={}; (p.data||[]).forEach(x=>(by[x.role_id]||(by[x.role_id]=[])).push(x.permission));
    window.content.innerHTML='<div class="bar"><button class="btn" onclick="newRole()">+ Add Role</button></div><div class="tablewrap"><table class="table"><tr><th>Role</th><th>Description</th><th>Permissions</th><th>Actions</th></tr>'+((r.data||[]).map(x=>`<tr><td><b>${window.esc(x.name)}</b></td><td>${window.esc(x.description||'')}</td><td>${window.esc((by[x.id]||[]).join(', ')||'None')}</td><td><button class="btn" onclick="editRole('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRole('${x.id}','${window.esc(x.name)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No roles yet</td></tr>')+'</table></div>';
  };
  window.newRole = function(){ window.modal('Add Role',`<label>Role Name<input id="nrName"></label><label>Description<textarea id="nrDesc"></textarea></label><label>Permissions</label><div>${window.menu.map(x=>`<label style="display:block"><input type="checkbox" class="nrPerm" value="${x[0]}" style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRole()'); };
  window.saveRole = async function(){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage roles.');
    const r=await window.db.from('erp_roles').insert({name:nrName.value.trim(),description:nrDesc.value.trim(),active:true}).select().single(); if(r.error) return window.toast(r.error.message);
    const selected=[...document.querySelectorAll('.nrPerm:checked')].map(x=>({role_id:r.data.id,permission:x.value})); if(selected.length){const q=await window.db.from('erp_role_permissions').insert(selected); if(q.error) return window.toast(q.error.message);}
    await window.logActivity('Role created',nrName.value); document.querySelector('.modalback')?.remove(); window.roles();
  };
  window.editRole = async function(id){
    if(window.profile?.role!=='Management') return window.toast('Only Management can manage roles.');
    const [r,p]=await Promise.all([window.db.from('erp_roles').select('*').eq('id',id).single(),window.db.from('erp_role_permissions').select('permission').eq('role_id',id)]); if(r.error) return window.toast(r.error.message);
    const selected=new Set((p.data||[]).map(x=>x.permission));
    window.modal('Edit Role',`<label>Role Name<input id="erName" value="${window.esc(r.data.name)}"></label><label>Description<textarea id="erDesc">${window.esc(r.data.description||'')}</textarea></label><label>Permissions</label><div>${window.menu.map(x=>`<label style="display:block"><input type="checkbox" class="erPerm" value="${x[0]}" ${selected.has(x[0])?'checked':''} style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRoleEdit(\''+id+'\')');
  };
  window.saveRoleEdit = async function(id){
    const r=await window.db.from('erp_roles').update({name:erName.value.trim(),description:erDesc.value.trim()}).eq('id',id); if(r.error) return window.toast(r.error.message);
    const d=await window.db.from('erp_role_permissions').delete().eq('role_id',id); if(d.error) return window.toast(d.error.message);
    const selected=[...document.querySelectorAll('.erPerm:checked')].map(x=>({role_id:id,permission:x.value})); if(selected.length){const q=await window.db.from('erp_role_permissions').insert(selected); if(q.error) return window.toast(q.error.message);}
    await window.logActivity('Role updated',erName.value); document.querySelector('.modalback')?.remove(); window.roles();
  };
  window.deleteRole = async function(id,name){
    if(window.profile?.role!=='Management') return window.toast('Only Management can delete roles.');
    const used=await window.db.from('profiles').select('id').eq('role',name).limit(1); if(used.data?.length) return window.toast('This role is assigned to a staff member. Reassign them before deleting it.');
    if(!confirm('Delete role '+name+'?')) return; const r=await window.db.from('erp_roles').delete().eq('id',id); if(r.error) return window.toast(r.error.message); window.roles();
  };
})();
</script><script>
    /* ERP Universal Search Controls */
    (function(){
      const oldGo = window.go;
      const searchable = new Set(['orders','salesactivity','production','procurement','inventory','qa','customers','payments','staff','roles','audit']);
      function addSearch(viewName){
        if(!searchable.has(viewName)) return;
        const existing=document.getElementById('erpUniversalSearch');
        if(existing) existing.remove();
        const table=content.querySelector('.table');
        const wrap=content.querySelector('.tablewrap');
        if(!table || !wrap) return;
        const box=document.createElement('div');
        box.id='erpUniversalSearch';
        box.className='bar';
        box.style.cssText='background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:14px 0 0;';
        box.innerHTML='<div style="display:flex;gap:8px;width:100%;align-items:center"><input id="erpSearchInput" type="search" placeholder="Search this page..." autocomplete="off" style="margin:0;flex:1"><button class="btn gray" id="erpSearchClear" type="button">Clear</button></div><div id="erpSearchCount" class="muted" style="margin-top:6px"></div>';
        wrap.parentNode.insertBefore(box,wrap);
        const input=document.getElementById('erpSearchInput');
        const count=document.getElementById('erpSearchCount');
        const clear=document.getElementById('erpSearchClear');
        const rows=()=>Array.from(table.querySelectorAll('tr')).slice(1);
        function run(){
          const q=input.value.trim().toLowerCase();
          let shown=0,total=0;
          rows().forEach(row=>{
            total++;
            const match=!q || row.textContent.toLowerCase().includes(q);
            row.style.display=match?'':'none';
            if(match) shown++;
          });
          count.textContent=q ? `${shown} of ${total} records shown` : `${total} records`;
        }
        input.addEventListener('input',run);
        clear.addEventListener('click',()=>{input.value='';run();input.focus();});
        input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';run();}});
        run();
      }
      window.go = async function(v){
        await oldGo(v);
        setTimeout(()=>addSearch(v),0);
      };
      document.addEventListener('keydown',e=>{
        if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
          const input=document.getElementById('erpSearchInput');
          if(input){e.preventDefault();input.focus();input.select();}
        }
      });
    })();
    </script>
