*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202f}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:#101827}.loginbox{background:#fff;width:min(430px,92%);padding:30px;border-radius:16px;box-shadow:0 20px 50px #0003}.brand{font-weight:800;letter-spacing:.8px}.muted{color:#667085;font-size:13px}input,select,textarea{width:100%;padding:10px 11px;margin:5px 0 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;cursor:pointer}.btn.gray{background:#667085}.btn.danger{background:#b42318}.btn.gold{background:#f0c060;color:#101827;font-weight:800}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#101827;color:#fff;padding:18px 12px;overflow:auto}.side h2{margin:3px 8px 0}.side small{display:block;margin:4px 8px 18px;color:#aab4c5}.navbtn{display:block;width:100%;padding:11px 12px;background:none;border:0;color:#dbe3ef;text-align:left;border-radius:8px;cursor:pointer;margin:2px 0}.navbtn:hover,.navbtn.active{background:#243148;color:#fff}.logout{margin-top:18px}.main{margin-left:235px;padding:26px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{margin:0 0 4px;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:17px}.metric{font-size:27px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-top:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px;white-space:nowrap}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px}.green{background:#dcfce7;color:#166534}.amber{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.empty{padding:30px;text-align:center;color:#667085}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:14px;padding:22px;width:min(600px,95%);max-height:92vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end}.error{color:#b42318;margin-top:10px}.markbar{background:linear-gradient(135deg,#101827,#243148);color:#fff;border-radius:14px;padding:18px;margin:18px 0}.markbar h3{margin:0 0 4px;color:#f0c060}.markbar p{margin:0;color:#cbd5e1;font-size:13px}.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.dot{width:9px;height:9px;border-radius:50%;background:#2563eb;margin-top:5px;flex:0 0 auto}@media(max-width:850px){.side{width:64px;padding:12px 8px}.side h2,.side small,.navbtn span{display:none}.main{margin-left:64px;padding:18px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{display:block}}
</style>

<body><div id="root"></div>
<script>
const SUPABASE_URL="https://tnbvlecniuwshiheiokl.supabase.co";
const SUPABASE_KEY="sb_publishable_Gqm3hqeCqvxmR59Wie-mEA_eO1MgwVK";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,view="dashboard";
const menu=[["dashboard","Dashboard"],["orders","Orders"],["salesactivity","Sales Calls & WhatsApp"],["production","Production"],["procurement","Procurement"],["inventory","Store / Inventory"],["qa","QA / QC"],["customers","Customers"],["payments","Payments"],["staff","Staff"],["roles","Roles & Permissions"],["audit","Audit Log"]];
const perms={Tailor:[],Finisher:[],Management:menu.map(x=>x[0]),Sales:["dashboard","orders","salesactivity","customers","payments","inventory","qa","procurement","production"],Procurement:["dashboard","procurement","inventory"],Store:["dashboard","inventory","qa","procurement","orders","production","customers"],Production:["dashboard","orders","production"],"QA/QC":["dashboard","orders","qa"],Accounts:["dashboard","payments"],Delivery:["dashboard","orders"]};
const STAGES=["Procurement","Awaiting Fitting","Cutting","Sewing","Finishing","Packaging","QA/QC","Delivery","Completed","Rework","On Hold"];
const money=n=>"₦"+Number(n||0).toLocaleString();
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const stageOptions=(selected="")=>STAGES.map(v=>`<option value="${esc(v)}" ${v===selected?"selected":""}>${esc(v)}</option>`).join("");
const can=v=>profile&&(v==="roles"?profile.role==="Management":(perms[profile.role]||[]).includes(v));
function toast(msg){alert(msg)}
async function logActivity(action,details){try{await db.from("audit_logs").insert({user_id:user?.id||null,action,details})}catch(e){console.warn("Activity log failed",e)}}
async function init(){const s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;await loadProfile()}render()}
async function loadProfile(){const r=await db.from("profiles").select("*").eq("id",user.id).single();profile=r.data||null}
async function signIn(){loginErr.textContent="";const r=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(r.error){loginErr.textContent=r.error.message;return}user=r.data.user;await loadProfile();render()}
async function signOut(){await db.auth.signOut();user=null;profile=null;render()}
function render(){if(!user){root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand">MARKCHARLES GARMENT FACTORY</div><h1 style="margin-top:8px">ERP Login</h1><p class="muted">Sign in with your assigned staff account.</p><label>Email<input id="loginEmail" type="email"></label><label>Password<input id="loginPassword" type="password"></label><button class="btn" style="width:100%" onclick="signIn()">Sign in</button><div id="loginErr" class="error"></div></div></div>`;return}if(!profile||!profile.active||profile.role==="Pending"){root.innerHTML=`<div class="login"><div class="loginbox"><h2>Account not ready</h2><p>Your account has not been assigned an active ERP role.</p><button class="btn gray" onclick="signOut()">Sign out</button></div></div>`;return}root.innerHTML=`<div class="app"><aside class="side"><h2>MARKCHARLES</h2><small>Garment Factory ERP</small><div id="nav"></div><button class="navbtn logout" onclick="signOut()">↪ <span>Log out</span></button></aside><main class="main"><div class="top"><div><h1 id="pageTitle"></h1><div class="muted">${esc(profile.full_name)} · ${esc(profile.role)}</div></div><span class="pill green">Cloud connected</span></div><div id="content"></div></main></div>`;buildNav();go(view)}
function buildNav(){nav.innerHTML=menu.filter(x=>can(x[0])).map(x=>`<button class="navbtn ${view===x[0]?"active":""}" onclick="go('${x[0]}')">▸ <span>${x[1]}</span></button>`).join("")}
async function go(v){if(!can(v))v="dashboard";view=v;buildNav();pageTitle.textContent={dashboard:"Factory Dashboard",orders:"Orders",salesactivity:"Sales Calls & WhatsApp",production:"Live Production",procurement:"Procurement",inventory:"Store / Inventory",qa:"QA / QC",customers:"Customers",payments:"Payments",staff:"Staff",roles:"Roles & Permissions",audit:"Audit Log"}[v];try{await ({dashboard,orders,salesactivity,production,procurement,inventory,qa,customers,payments,staff,roles,audit}[v])()}catch(e){console.error(e);content.innerHTML=`<div class="card"><b>Unable to load ${esc(v)}</b><p class="error">${esc(e.message||e)}</p></div>`}}
async function getCustomers(){const r=await db.from("customers").select("id,name,type,phone,email").order("name");if(r.error)throw r.error;return r.data||[]}
async function getOrders(){const r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)throw r.error;return r.data||[]}
async function paymentTotals(){const r=await db.from("payments").select("order_id,amount");if(r.error)throw r.error;const m={};(r.data||[]).forEach(x=>m[x.order_id]=(m[x.order_id]||0)+(Number(x.amount)||0));return m}
async function dashboard(){const [orders,customers,payments,prod,proc,qaRows,sales,inv]=await Promise.all([getOrders(),getCustomers(),db.from("payments").select("*").order("created_at",{ascending:false}),db.from("order_production_items").select("*").order("created_at",{ascending:false}).limit(50),db.from("procurement_requests").select("*").order("created_at",{ascending:false}).limit(50),db.from("qa_inspections").select("*").order("created_at",{ascending:false}).limit(50),db.from("sales_activities").select("*").order("created_at",{ascending:false}).limit(50),db.from("inventory_items").select("*")]);const cmap=Object.fromEntries(customers.map(x=>[x.id,x.name])),pmap={};(payments.data||[]).forEach(x=>pmap[x.order_id]=(pmap[x.order_id]||0)+Number(x.amount||0));const active=orders.filter(x=>x.stage!=="Completed"),value=orders.reduce((s,x)=>s+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0),outstanding=orders.reduce((s,x)=>s+Math.max(0,(Number(x.quantity)||0)*(Number(x.unit_price)||0)-(pmap[x.id]||0)),0),low=(inv.data||[]).filter(x=>Number(x.stock)<=Number(x.reorder_level)).length;const today=new Date(),days=d=>d?Math.ceil((new Date(d+"T23:59:59")-today)/86400000):999,overdue=active.filter(x=>days(x.due_date)<0).length,risk=active.filter(x=>days(x.due_date)>=0&&days(x.due_date)<=3).length;const activity=[];orders.slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Order created",text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.product||"Order"} · ${x.order_no}`}));(payments.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Payment recorded",text:`${money(x.amount)} · ${x.method||""}`}));(prod.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Production task",text:`${x.item_name||"Item"} · ${x.stage||""}`}));(proc.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Procurement request",text:`${x.item||"Material"} · ${money(x.amount)}`}));(qaRows.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"QA/QC inspection",text:`${x.status||""} · ${x.measurement||""}`}));(sales.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:`${x.activity_type||"Sales"} logged`,text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.outcome||""}`}));activity.sort((a,b)=>new Date(b.t)-new Date(a.t));content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Active Orders</div><div class="metric">${active.length}</div></div><div class="card"><div class="muted">Pipeline Value</div><div class="metric">${money(value)}</div></div><div class="card"><div class="muted">Outstanding Balance</div><div class="metric" style="color:#b42318">${money(outstanding)}</div></div><div class="card"><div class="muted">At Risk / Overdue</div><div class="metric">${risk} / ${overdue}</div></div></div><div class="markbar"><h3>Factory Snapshot</h3><p>Everything important happening in the ERP is summarized here.</p><div class="grid">${STAGES.map(s=>{const n=orders.filter(x=>(x.stage||"Procurement")===s).length;return `<div class="card" style="margin:0"><div class="metric">${n}</div><b>${s}</b></div>`}).join("")}</div></div><div class="grid"><div class="card"><div class="muted">Production Tasks</div><div class="metric">${(prod.data||[]).length}</div></div><div class="card"><div class="muted">Pending Procurement</div><div class="metric">${(proc.data||[]).filter(x=>!['Received','Rejected'].includes(x.status)).length}</div></div><div class="card"><div class="muted">QA/QC Inspections</div><div class="metric">${(qaRows.data||[]).length}</div></div><div class="card"><div class="muted">Low Stock Items</div><div class="metric">${low}</div></div></div><div class="card"><h3>Recent Activity</h3>${activity.slice(0,25).map(a=>`<div class="activity"><span class="dot"></span><div><b>${esc(a.title)}</b><div>${esc(a.text)}</div><div class="muted">${new Date(a.t).toLocaleString()}</div></div></div>`).join("")||'<div class="empty">No activity yet</div>'}</div><div class="card"><h3>Orders & Balances</h3><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Product</th><th>Total</th><th>Paid</th><th>Balance</th><th>Stage</th></tr>${orders.slice(0,15).map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),paid=pmap[x.id]||0;return `<tr><td><b>${esc(cmap[x.customer_id]||"Unknown customer")}</b></td><td>${esc(x.order_no)}</td><td>${esc(x.product)}</td><td>${money(total)}</td><td>${money(paid)}</td><td><b>${money(Math.max(0,total-paid))}</b></td><td>${esc(x.stage||"")}</td></tr>`}).join("")||'<tr><td colspan="7" class="empty">No orders yet</td></tr>'}</table></div></div>`}
async function orders(){const [o,c,p]=await Promise.all([getOrders(),getCustomers(),paymentTotals()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newOrder()">+ New Order</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Service</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Paid</th><th>Balance</th><th>Stage</th><th>Due</th><th>Action</th></tr>${o.map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0),paid=p[x.id]||0;return `<tr><td><b>${esc(cm[x.customer_id]||'Unknown')}</b></td><td>${esc(x.order_no)}</td><td>${esc(x.service||'')}</td><td>${esc(x.product||'')}</td><td>${x.quantity} ${esc(x.unit||'')}</td><td>${money(x.unit_price)}</td><td>${money(total)}</td><td>${money(paid)}</td><td>${money(Math.max(0,total-paid))}</td><td>${esc(x.stage||'')}</td><td>${esc(x.due_date||'')}</td><td><button class="btn" onclick="editOrder('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('orders','${x.id}','order')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="12" class="empty">No orders yet</td></tr>'}</table></div>`}
async function newOrder(){const [c,s]=await Promise.all([getCustomers(),db.from('profiles').select('id,full_name,role').eq('active',true).order('full_name')]);modal('New Order',`<label>Customer<select id="oCustomer">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Service<select id="oService">${['Wholesale','Corporate','R2W','Bespoke','School Uniform','Hotel Uniform','Wedding'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Product<input id="oProduct" placeholder="Senator"></label><label>Quantity<input id="oQty" type="number" min="1" value="1"></label><label>Unit<select id="oUnit"><option>pcs</option><option>pair</option><option>package</option><option>yard</option></select></label><label>Unit Price<input id="oPrice" type="number" min="0"></label><label>Due Date<input id="oDue" type="date"></label><label>Priority<select id="oPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></label><label>Assigned Staff<select id="oAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.full_name||x.id)} · ${esc(x.role||'')}</option>`).join('')}</select></label><label>Fabric<input id="oFabric"></label><label>Measurements / Sizes<textarea id="oMeasurements"></textarea></label><label>Notes<textarea id="oNotes"></textarea></label><label>Initial Payment<input id="oInitial" type="number" min="0" value="0"></label>`,'saveOrder()')}
async function saveOrder(){const r=await db.from('orders').insert({customer_id:oCustomer.value,service:oService.value,product:oProduct.value,quantity:+oQty.value,unit:oUnit.value,unit_price:+oPrice.value,due_date:oDue.value||null,priority:oPriority.value,assigned_to:oAssigned.value||null,fabric:oFabric.value,measurements:oMeasurements.value,notes:oNotes.value,stage:'Procurement'}).select().single();if(r.error)return toast(r.error.message);if(+oInitial.value>0)await db.from('payments').insert({order_id:r.data.id,customer_id:oCustomer.value,amount:+oInitial.value,method:'Initial',paid_on:new Date().toISOString().slice(0,10),recorded_by:user.id});await logActivity('Order created',`${oProduct.value} for ${oCustomer.options[oCustomer.selectedIndex]?.text||''}`);document.querySelector('.modalback')?.remove();orders()}
async function editOrder(id){const r=await db.from('orders').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const [c,s]=await Promise.all([getCustomers(),db.from('profiles').select('id,full_name,role').eq('active',true).order('full_name')]);modal('Edit Order',`<label>Customer<select id="eoCustomer">${c.map(x=>`<option value="${x.id}" ${x.id===r.data.customer_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Service<select id="eoService">${['Wholesale','Corporate','R2W','Bespoke','School Uniform','Hotel Uniform','Wedding'].map(x=>`<option ${x===r.data.service?'selected':''}>${x}</option>`).join('')}</select></label><label>Product<input id="eoProduct" value="${esc(r.data.product||'')}"></label><label>Quantity<input id="eoQty" type="number" value="${r.data.quantity||0}"></label><label>Unit<select id="eoUnit">${['pcs','pair','package','yard'].map(x=>`<option ${x===r.data.unit?'selected':''}>${x}</option>`).join('')}</select></label><label>Unit Price<input id="eoPrice" type="number" value="${r.data.unit_price||0}"></label><label>Due Date<input id="eoDue" type="date" value="${r.data.due_date||''}"></label><label>Priority<select id="eoPriority">${['Normal','High','Urgent'].map(x=>`<option ${x===r.data.priority?'selected':''}>${x}</option>`).join('')}</select></label><label>Assigned Staff<select id="eoAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}" ${x.id===r.data.assigned_to?'selected':''}>${esc(x.full_name||x.id)} · ${esc(x.role||'')}</option>`).join('')}</select></label><label>Fabric<input id="eoFabric" value="${esc(r.data.fabric||'')}"></label><label>Measurements / Sizes<textarea id="eoMeasurements">${esc(r.data.measurements||'')}</textarea></label><label>Notes<textarea id="eoNotes">${esc(r.data.notes||'')}</textarea></label><label>Stage<select id="eoStage">${stageOptions(r.data.stage||'Procurement')}</select></label>`,'saveOrderEdit(\''+id+'\')')}
async function saveOrderEdit(id){const r=await db.from('orders').update({customer_id:eoCustomer.value,service:eoService.value,product:eoProduct.value,quantity:+eoQty.value,unit:eoUnit.value,unit_price:+eoPrice.value,due_date:eoDue.value||null,priority:eoPriority.value,assigned_to:eoAssigned.value||null,fabric:eoFabric.value,measurements:eoMeasurements.value,notes:eoNotes.value,stage:eoStage.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Order updated',id);document.querySelector('.modalback')?.remove();orders()}
async function salesactivity(){const [r,c]=await Promise.all([db.from('sales_activities').select('*').order('created_at',{ascending:false}),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newSalesActivity()">+ Log Call / WhatsApp</button></div><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Type</th><th>Direction</th><th>Outcome</th><th>Follow Up</th><th>Notes</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(cm[x.customer_id]||'Unknown')}</td><td>${esc(x.activity_type||'')}</td><td>${esc(x.direction||'')}</td><td>${esc(x.outcome||'')}</td><td>${esc(x.follow_up_date||'')}</td><td>${esc(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No sales activity yet</td></tr>'}</table></div>`}
async function newSalesActivity(){const c=await getCustomers();modal('Log Sales Call / WhatsApp',`<label>Customer<select id="saCustomer">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Type<select id="saType"><option>Call</option><option>WhatsApp</option></select></label><label>Direction<select id="saDirection"><option>Outbound</option><option>Inbound</option></select></label><label>Outcome<input id="saOutcome"></label><label>Follow Up Date<input id="saFollow" type="date"></label><label>Notes<textarea id="saNotes"></textarea></label>`,'saveSalesActivity()')}
async function saveSalesActivity(){const r=await db.from('sales_activities').insert({staff_id:user.id,customer_id:saCustomer.value,activity_type:saType.value,direction:saDirection.value,outcome:saOutcome.value,notes:saNotes.value,follow_up_date:saFollow.value||null});if(r.error)return toast(r.error.message);await logActivity(`${saType.value} logged`,`${saType.value} logged for ${saCustomer.value}`);document.querySelector('.modalback')?.remove();salesactivity()}
async function customers(){const r=await db.from('customers').select('*').order('name');content.innerHTML=`<div class="bar"><button class="btn" onclick="newCustomer()">+ Customer</button></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Type</th><th>Phone</th><th>Email</th><th>Address</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.type||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.email||'')}</td><td>${esc(x.address||'')}</td><td><button class="btn" onclick="editCustomer('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('customers','${x.id}','customer')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No customers yet</td></tr>'}</table></div>`}
async function newCustomer(){modal('New Customer',`<label>Name<input id="fName"></label><label>Type<select id="fType">${['Corporate','Wholesale','Retail','School','Hotel','Bespoke','Wedding'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Phone<input id="fPhone"></label><label>Email<input id="fEmail"></label><label>Address<textarea id="fAddress"></textarea></label>`,'saveCustomer()')}
async function saveCustomer(){const r=await db.from('customers').insert({name:fName.value,type:fType.value,phone:fPhone.value,email:fEmail.value,address:fAddress.value});if(r.error)return toast(r.error.message);await logActivity('Customer created',fName.value);document.querySelector('.modalback')?.remove();customers()}
async function editCustomer(id){const r=await db.from('customers').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Customer',`<label>Name<input id="ecName" value="${esc(r.data.name||'')}"></label><label>Type<select id="ecType">${['Corporate','Wholesale','Retail','School','Hotel','Bespoke','Wedding'].map(x=>`<option ${x===r.data.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Phone<input id="ecPhone" value="${esc(r.data.phone||'')}"></label><label>Email<input id="ecEmail" value="${esc(r.data.email||'')}"></label><label>Address<textarea id="ecAddress">${esc(r.data.address||'')}</textarea></label>`,'saveCustomerEdit(\''+id+'\')')}
async function saveCustomerEdit(id){const r=await db.from('customers').update({name:ecName.value,type:ecType.value,phone:ecPhone.value,email:ecEmail.value,address:ecAddress.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Customer updated',ecName.value);document.querySelector('.modalback')?.remove();customers()}
async function inventory(){const r=await db.from('inventory_items').select('*').order('name');content.innerHTML=`<div class="bar"><button class="btn" onclick="newInventory()">+ Add Item</button><button class="btn" onclick="receiveStock()">↙ Receive Stock</button><button class="btn" onclick="issueAccessory()">↗ Issue Accessory</button><button class="btn gray" onclick="returnAccessory()">↩ Collect / Return</button></div><div class="tablewrap"><table class="table"><tr><th>Code</th><th>Item</th><th>Category</th><th>Stock</th><th>Unit</th><th>Reorder</th><th>Unit Cost</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.code||'')}</td><td>${esc(x.name)}</td><td>${esc(x.category||'')}</td><td>${x.stock}</td><td>${esc(x.unit||'')}</td><td>${x.reorder_level}</td><td>${money(x.unit_cost)}</td><td><button class="btn" onclick="editInventory('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('inventory_items','${x.id}','inventory item')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No inventory items yet</td></tr>'}</table></div>`}
async function newInventory(){modal('Add Inventory Item',`<label>Code<input id="niCode"></label><label>Name<input id="niName"></label><label>Category<input id="niCategory"></label><label>Unit<select id="niUnit"><option>yard</option><option>pcs</option><option>pair</option><option>package</option></select></label><label>Opening Stock<input id="niStock" type="number" value="0"></label><label>Reorder Level<input id="niReorder" type="number" value="0"></label><label>Unit Cost<input id="niCost" type="number" value="0"></label>`,'saveInventory()')}
async function saveInventory(){const r=await db.from('inventory_items').insert({code:niCode.value,name:niName.value,category:niCategory.value,unit:niUnit.value,stock:+niStock.value,reorder_level:+niReorder.value,unit_cost:+niCost.value});if(r.error)return toast(r.error.message);await logActivity('Inventory item created',niName.value);document.querySelector('.modalback')?.remove();inventory()}
async function editInventory(id){const r=await db.from('inventory_items').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Inventory Item',`<label>Code<input id="eiCode" value="${esc(r.data.code||'')}"></label><label>Name<input id="eiName" value="${esc(r.data.name||'')}"></label><label>Category<input id="eiCategory" value="${esc(r.data.category||'')}"></label><label>Unit<select id="eiUnit">${['yard','pcs','pair','package'].map(x=>`<option ${x===r.data.unit?'selected':''}>${x}</option>`).join('')}</select></label><label>Stock<input id="eiStock" type="number" value="${r.data.stock||0}"></label><label>Reorder Level<input id="eiReorder" type="number" value="${r.data.reorder_level||0}"></label><label>Unit Cost<input id="eiCost" type="number" value="${r.data.unit_cost||0}"></label>`,'saveInventoryEdit(\''+id+'\')')}
async function saveInventoryEdit(id){const r=await db.from('inventory_items').update({code:eiCode.value,name:eiName.value,category:eiCategory.value,unit:eiUnit.value,stock:+eiStock.value,reorder_level:+eiReorder.value,unit_cost:+eiCost.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Inventory updated',eiName.value);document.querySelector('.modalback')?.remove();inventory()}
async function receiveStock(){const r=await db.from('inventory_items').select('id,name,unit').order('name');modal('Receive Stock',`<label>Item<select id="rsItem">${(r.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} (${esc(x.unit)})</option>`).join('')}</select></label><label>Quantity<input id="rsQty" type="number" min="1"></label>`,'saveReceiveStock()')}
async function saveReceiveStock(){const item=await db.from('inventory_items').select('stock,name').eq('id',rsItem.value).single();if(item.error)return toast(item.error.message);const r=await db.from('inventory_items').update({stock:Number(item.data.stock||0)+Number(rsQty.value||0)}).eq('id',rsItem.value);if(r.error)return toast(r.error.message);await logActivity('Stock received',`${rsQty.value} added to ${item.data.name}`);document.querySelector('.modalback')?.remove();inventory()}
async function issueAccessory(){toast('Accessory issue screen can be added to the existing store workflow once the transaction columns are confirmed.')}
async function returnAccessory(){toast('Collect / Return screen can be added to the existing store workflow once the transaction columns are confirmed.')}
async function staff(){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').select('*').order('full_name');if(r.error)return toast(r.error.message);content.innerHTML=`<div class="bar"><button class="btn" onclick="newStaff()">+ Add Staff</button></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email||'')}</td><td>${esc(x.role||'')}</td><td>${x.active?'Active':'Inactive'}</td><td><button class="btn" onclick="editStaff('${x.id}')">Edit</button> <button class="btn gray" onclick="toggleStaff('${x.id}',${!x.active})">${x.active?'Deactivate':'Activate'}</button> <button class="btn danger" onclick="deleteStaff('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No staff yet</td></tr>'}</table></div>`}
async function newStaff(){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const roles=await db.from('erp_roles').select('name').eq('active',true).order('name');modal('Add Staff Profile',`<p class="muted">Create the staff login in Supabase Authentication first, then enter the same User ID here.</p><label>Auth User ID<input id="nsId" placeholder="UUID from Authentication"></label><label>Full Name<input id="nsName"></label><label>Email<input id="nsEmail" type="email"></label><label>Role<select id="nsRole">${(roles.data||[]).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><label><input id="nsActive" type="checkbox" checked style="width:auto"> Active</label>`,'saveStaff()')}
async function saveStaff(){const r=await db.from('profiles').insert({id:nsId.value.trim(),full_name:nsName.value.trim(),email:nsEmail.value.trim(),role:nsRole.value,active:nsActive.checked});if(r.error)return toast(r.error.message);await logActivity('Staff profile created',nsName.value);document.querySelector('.modalback')?.remove();staff()}
async function editStaff(id){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const roles=await db.from('erp_roles').select('name').eq('active',true).order('name');modal('Edit Staff',`<label>Full Name<input id="esName" value="${esc(r.data.full_name||'')}"></label><label>Email<input id="esEmail" type="email" value="${esc(r.data.email||'')}"></label><label>Role<select id="esRole">${(roles.data||[]).map(x=>`<option ${x.name===r.data.role?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label><input id="esActive" type="checkbox" ${r.data.active?'checked':''} style="width:auto"> Active</label>`,'saveStaffEdit(\''+id+'\')')}
async function saveStaffEdit(id){const r=await db.from('profiles').update({full_name:esName.value.trim(),email:esEmail.value.trim(),role:esRole.value,active:esActive.checked}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Staff profile updated',esName.value);document.querySelector('.modalback')?.remove();staff()}
async function toggleStaff(id,active){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').update({active}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity(active?'Staff activated':'Staff deactivated',id);staff()}
async function deleteStaff(id){if(profile?.role!=='Management')return toast('Only Management can manage staff.');if(id===user.id)return toast('You cannot delete your own active profile. Deactivate it instead.');if(!confirm('Delete this staff profile? The authentication account is not deleted.'))return;const r=await db.from('profiles').delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Staff profile deleted',id);staff()}
async function roles(){if(profile?.role!=='Management')return toast('Only Management can manage roles and permissions.');const [r,p]=await Promise.all([db.from('erp_roles').select('*').order('name'),db.from('erp_role_permissions').select('*')]);if(r.error)return toast(r.error.message);if(p.error)return toast(p.error.message);const permsBy={};(p.data||[]).forEach(x=>(permsBy[x.role_id]||(permsBy[x.role_id]=[])).push(x.permission));content.innerHTML=`<div class="bar"><button class="btn" onclick="newRole()">+ Add Role</button></div><div class="tablewrap"><table class="table"><tr><th>Role</th><th>Description</th><th>Permissions</th><th>Actions</th></tr>${(r.data||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description||'')}</td><td>${esc((permsBy[x.id]||[]).join(', ')||'None')}</td><td><button class="btn" onclick="editRole('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRole('${x.id}','${esc(x.name)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No roles yet</td></tr>'}</table></div>`}
async function newRole(){modal('Add Role',`<label>Role Name<input id="nrName"></label><label>Description<textarea id="nrDesc"></textarea></label><label>Permissions</label><div>${menu.map(x=>`<label style="display:block"><input type="checkbox" class="nrPerm" value="${x[0]}" style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRole()')}
async function saveRole(){if(profile?.role!=='Management')return toast('Only Management can manage roles.');const r=await db.from('erp_roles').insert({name:nrName.value.trim(),description:nrDesc.value.trim(),active:true}).select().single();if(r.error)return toast(r.error.message);const selected=[...document.querySelectorAll('.nrPerm:checked')].map(x=>({role_id:r.data.id,permission:x.value}));if(selected.length){const p=await db.from('erp_role_permissions').insert(selected);if(p.error)return toast(p.error.message)}await logActivity('Role created',nrName.value);document.querySelector('.modalback')?.remove();roles()}
async function editRole(id){if(profile?.role!=='Management')return toast('Only Management can manage roles.');const [r,p]=await Promise.all([db.from('erp_roles').select('*').eq('id',id).single(),db.from('erp_role_permissions').select('permission').eq('role_id',id)]);if(r.error)return toast(r.error.message);const selected=new Set((p.data||[]).map(x=>x.permission));modal('Edit Role',`<label>Role Name<input id="erName" value="${esc(r.data.name)}"></label><label>Description<textarea id="erDesc">${esc(r.data.description||'')}</textarea></label><label>Permissions</label><div>${menu.map(x=>`<label style="display:block"><input type="checkbox" class="erPerm" value="${x[0]}" ${selected.has(x[0])?'checked':''} style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRoleEdit(\''+id+'\')')}
async function saveRoleEdit(id){const old=await db.from('erp_roles').select('name').eq('id',id).single();const r=await db.from('erp_roles').update({name:erName.value.trim(),description:erDesc.value.trim()}).eq('id',id);if(r.error)return toast(r.error.message);const d=await db.from('erp_role_permissions').delete().eq('role_id',id);if(d.error)return toast(d.error.message);const selected=[...document.querySelectorAll('.erPerm:checked')].map(x=>({role_id:id,permission:x.value}));if(selected.length){const p=await db.from('erp_role_permissions').insert(selected);if(p.error)return toast(p.error.message)}await logActivity('Role updated',erName.value);document.querySelector('.modalback')?.remove();roles()}
async function deleteRole(id,name){if(profile?.role!=='Management')return toast('Only Management can delete roles.');const used=await db.from('profiles').select('id').eq('role',name).limit(1);if(used.data?.length)return toast('This role is assigned to a staff member. Reassign them before deleting it.');if(!confirm('Delete role '+name+'?'))return;const r=await db.from('erp_roles').delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Role deleted',name);roles()}
async function audit(){const r=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(150);content.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>${(r.data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.user_id||'')}</td><td>${esc(x.action||'')}</td><td>${esc(x.details||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit entries yet</td></tr>'}</table></div>`}
async function deleteRecord(table,id,label){if(profile?.role!=='Management')return toast('Only Management can delete records.');if(!confirm('Delete '+label+'? This cannot be undone.'))return;const r=await db.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity(`${label} deleted`,id);go(view)}
function modal(title,body,saveFn){const wrap=document.createElement('div');wrap.className='modalback';wrap.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="actions"><button class="btn gray" type="button" onclick="this.closest('.modalback').remove()">Cancel</button><button class="btn" type="button" onclick="${saveFn}">Save</button></div></div>`;document.body.appendChild(wrap)}
async function editPayment(id){const r=await db.from('payments').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const [o,c]=await Promise.all([getOrders(),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));modal('Edit Payment',`<label>Customer / Order<select id="epOrder">${o.map(x=>`<option value="${x.id}" ${x.id===r.data.order_id?'selected':''}>${esc(cm[x.customer_id]||'Unknown')} · ${esc(x.order_no)} · ${esc(x.product)}</option>`).join('')}</select></label><label>Amount<input id="epAmount" type="number" value="${r.data.amount||0}"></label><label>Method<select id="epMethod">${['Transfer','Cash','POS','Card'].map(x=>`<option ${x===r.data.method?'selected':''}>${x}</option>`).join('')}</select></label><label>Paid On<input id="epDate" type="date" value="${r.data.paid_on||''}"></label>`,'savePaymentEdit(\''+id+'\')')}
async function savePaymentEdit(id){const r=await db.from('payments').update({order_id:epOrder.value,amount:+epAmount.value,method:epMethod.value,paid_on:epDate.value||null}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Payment updated',id);document.querySelector('.modalback')?.remove();payments()}
init();
</script>
<script>
/* MARKCHARLES SEARCH V2 */
(function(){
  const oldGo=window.go;
  const searchable=new Set(['orders','salesactivity','production','procurement','inventory','qa','customers','payments','staff','roles','audit']);
  function addSearch(viewName){
    if(!searchable.has(viewName)) return;
    const old=document.getElementById('erpUniversalSearch');
    if(old) old.remove();
    const host=document.getElementById('content');
    const table=host?.querySelector('table.table');
    const wrap=host?.querySelector('.tablewrap');
    if(!host || !table || !wrap) return;
    const box=document.createElement('div');
    box.id='erpUniversalSearch';
    box.className='bar';
    box.style.cssText='background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:14px 0 0;';
    box.innerHTML='<div style="display:flex;gap:8px;width:100%;align-items:center"><input id="erpSearchInput" type="search" placeholder="Search by customer, order, payment, product, staff..." autocomplete="off" style="margin:0;flex:1"><button class="btn gray" id="erpSearchClear" type="button">Clear</button></div><div id="erpSearchCount" class="muted" style="margin-top:6px"></div>';
    wrap.parentNode.insertBefore(box,wrap);
    const input=box.querySelector('#erpSearchInput');
    const count=box.querySelector('#erpSearchCount');
    const clear=box.querySelector('#erpSearchClear');
    const rows=()=>Array.from(table.querySelectorAll('tr')).slice(1);
    function run(){
      const q=input.value.trim().toLowerCase();
      let shown=0,total=0;
      rows().forEach(row=>{total++;const match=!q||row.textContent.toLowerCase().includes(q);row.style.display=match?'':'none';if(match)shown++;});
      count.textContent=q?`${shown} of ${total} records shown`:`${total} records`;
    }
    input.addEventListener('input',run);
    clear.addEventListener('click',()=>{input.value='';run();input.focus();});
    input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';run();}});
    run();
  }
  window.go=async function(v){
    await oldGo(v);
    setTimeout(()=>addSearch(v),20);
  };
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      const input=document.getElementById('erpSearchInput');
      if(input){e.preventDefault();input.focus();input.select();}
    }
  });
})();
</script>
