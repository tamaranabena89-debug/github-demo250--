ckground:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.empty{padding:30px;text-align:center;color:#667085}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:14px;padding:22px;width:min(600px,95%);max-height:92vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end}.error{color:#b42318;margin-top:10px}.markbar{background:linear-gradient(135deg,#101827,#243148);color:#fff;border-radius:14px;padding:18px;margin:18px 0}.markbar h3{margin:0 0 4px;color:#f0c060}.markbar p{margin:0;color:#cbd5e1;font-size:13px}.activity{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.dot{width:9px;height:9px;border-radius:50%;background:#2563eb;margin-top:5px;flex:0 0 auto}@media(max-width:850px){.side{width:64px;padding:12px 8px}.side h2,.side small,.navbtn span{display:none}.main{margin-left:64px;padding:18px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{display:block}}

<body><div id="root"></div>
<script>
const SUPABASE_URL="https://tnbvlecniuwshiheiokl.supabase.co";
const SUPABASE_KEY="sb_publishable_Gqm3hqeCqvxmR59Wie-mEA_eO1MgwVK";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,view="dashboard";
const menu=[["dashboard","Dashboard"],["orders","Orders"],["salesactivity","Sales Calls & WhatsApp"],["production","Production"],["procurement","Procurement"],["inventory","Store / Inventory"],["qa","QA / QC"],["customers","Customers"],["payments","Payments"],["staff","Staff"],["roles","Roles & Permissions"],["audit","Audit Log"]];
const perms={Tailor:[],Finisher:[],Management:menu.map(x=>x[0]),Sales:["dashboard","orders","salesactivity","customers","payments","inventory","qa","procurement","production"],Procurement:["dashboard","procurement","inventory"],Store:["dashboard","inventory","qa","procurement","orders","production","customers"],Production:["dashboard","orders","production"],"QA/QC":["dashboard","orders","qa"],Accounts:["dashboard","payments"],Delivery:["dashboard","orders"]};
const STAGES=["Procurement","Awaiting Fitting","Cutting","Sewing","Finishing","Packaging","QA/QC","Delivery","Completed","Rework","On Hold"];
const money=n=>"₦"+Number(n||0).toLocaleString();
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const stageOptions=(selected="")=>STAGES.map(v=>`<option value="${esc(v)}" ${v===selected?"selected":""}>${esc(v)}</option>`).join("");
const can=v=>profile&&(v==="roles"?profile.role==="Management":(perms[profile.role]||[]).includes(v));
function toast(msg){alert(msg)}
async function logActivity(action,details){try{await db.from("audit_logs").insert({user_id:user?.id||null,action,details})}catch(e){console.warn("Activity log failed",e)}}
async function init(){const s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;await loadProfile()}render()}
async function loadProfile(){const r=await db.from("profiles").select("*").eq("id",user.id).single();profile=r.data||null}
async function signIn(){loginErr.textContent="";const r=await db.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(r.error){loginErr.textContent=r.error.message;return}user=r.data.user;await loadProfile();render()}
async function signOut(){await db.auth.signOut();user=null;profile=null;render()}
function render(){if(!user){root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand">MARKCHARLES GARMENT FACTORY</div><h1 style="margin-top:8px">ERP Login</h1><p class="muted">Sign in with your assigned staff account.</p><label>Email<input id="loginEmail" type="email"></label><label>Password<input id="loginPassword" type="password"></label><button class="btn" style="width:100%" onclick="signIn()">Sign in</button><div id="loginErr" class="error"></div></div></div>`;return}if(!profile||!profile.active||profile.role==="Pending"){root.innerHTML=`<div class="login"><div class="loginbox"><h2>Account not ready</h2><p>Your account has not been assigned an active ERP role.</p><button class="btn gray" onclick="signOut()">Sign out</button></div></div>`;return}root.innerHTML=`<div class="app"><aside class="side"><h2>MARKCHARLES</h2><small>Garment Factory ERP</small><div id="nav"></div><button class="navbtn logout" onclick="signOut()">↪ <span>Log out</span></button></aside><main class="main"><div class="top"><div><h1 id="pageTitle"></h1><div class="muted">${esc(profile.full_name)} · ${esc(profile.role)}</div></div><span class="pill green">Cloud connected</span></div><div id="content"></div></main></div>`;buildNav();go(view)}
function buildNav(){nav.innerHTML=menu.filter(x=>can(x[0])).map(x=>`<button class="navbtn ${view===x[0]?"active":""}" onclick="go('${x[0]}')">▸ <span>${x[1]}</span></button>`).join("")}
async function go(v){if(!can(v))v="dashboard";view=v;buildNav();pageTitle.textContent={dashboard:"Factory Dashboard",orders:"Orders",salesactivity:"Sales Calls & WhatsApp",production:"Live Production",procurement:"Procurement",inventory:"Store / Inventory",qa:"QA / QC",customers:"Customers",payments:"Payments",staff:"Staff",roles:"Roles & Permissions",audit:"Audit Log"}[v];try{await ({dashboard,orders,salesactivity,production,procurement,inventory,qa,customers,payments,staff,roles,audit}[v])()}catch(e){console.error(e);content.innerHTML=`<div class="card"><b>Unable to load ${esc(v)}</b><p class="error">${esc(e.message||e)}</p></div>`}}
async function getCustomers(){const r=await db.from("customers").select("id,name,type,phone,email").order("name");if(r.error)throw r.error;return r.data||[]}
async function getOrders(){const r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)throw r.error;return r.data||[]}
async function dashboard(){const [orders,customers,payments,prod,proc,qaRows,sales,inv]=await Promise.all([getOrders(),getCustomers(),db.from("payments").select("*").order("created_at",{ascending:false}),db.from("order_production_items").select("*").order("created_at",{ascending:false}).limit(50),db.from("procurement_requests").select("*").order("created_at",{ascending:false}).limit(50),db.from("qa_inspections").select("*").order("created_at",{ascending:false}).limit(50),db.from("sales_activities").select("*").order("created_at",{ascending:false}).limit(50),db.from("inventory_items").select("*")]);const cmap=Object.fromEntries(customers.map(x=>[x.id,x.name])),pmap={};(payments.data||[]).forEach(x=>pmap[x.order_id]=(pmap[x.order_id]||0)+Number(x.amount||0));const active=orders.filter(x=>x.stage!=="Completed"),value=orders.reduce((s,x)=>s+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0),outstanding=orders.reduce((s,x)=>s+Math.max(0,(Number(x.quantity)||0)*(Number(x.unit_price)||0)-(pmap[x.id]||0)),0),low=(inv.data||[]).filter(x=>Number(x.stock)<=Number(x.reorder_level)).length;const today=new Date(),days=d=>d?Math.ceil((new Date(d+"T23:59:59")-today)/86400000):999,overdue=active.filter(x=>days(x.due_date)<0).length,risk=active.filter(x=>days(x.due_date)>=0&&days(x.due_date)<=3).length;const activity=[];orders.slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Order created",text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.product||"Order"} · ${x.order_no}`}));(payments.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Payment recorded",text:`${money(x.amount)} · ${x.method||""}`}));(prod.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Production task",text:`${x.item_name||"Item"} · ${x.stage||""}`}));(proc.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"Procurement request",text:`${x.item||"Material"} · ${money(x.amount)}`}));(qaRows.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:"QA/QC inspection",text:`${x.status||""} · ${x.measurement||""}`}));(sales.data||[]).slice(0,10).forEach(x=>activity.push({t:x.created_at,title:`${x.activity_type||"Sales"} logged`,text:`${cmap[x.customer_id]||"Unknown customer"} · ${x.outcome||""}`}));activity.sort((a,b)=>new Date(b.t)-new Date(a.t));content.innerHTML=`<div class="grid"><div class="card"><div class="muted">Active Orders</div><div class="metric">${active.length}</div></div><div class="card"><div class="muted">Pipeline Value</div><div class="metric">${money(value)}</div></div><div class="card"><div class="muted">Outstanding Balance</div><div class="metric" style="color:#b42318">${money(outstanding)}</div></div><div class="card"><div class="muted">At Risk / Overdue</div><div class="metric">${risk} / ${overdue}</div></div></div><div class="markbar"><h3>Factory Snapshot</h3><p>Everything important happening in the ERP is summarized here.</p><div class="grid">${STAGES.map(s=>{const n=orders.filter(x=>(x.stage||"Procurement")===s).length;return `<div class="card" style="margin:0"><div class="metric">${n}</div><b>${s}</b></div>`}).join("")}</div></div><div class="grid"><div class="card"><div class="muted">Production Tasks</div><div class="metric">${(prod.data||[]).length}</div></div><div class="card"><div class="muted">Pending Procurement</div><div class="metric">${(proc.data||[]).filter(x=>!['Received','Rejected'].includes(x.status)).length}</div></div><div class="card"><div class="muted">QA/QC Inspections</div><div class="metric">${(qaRows.data||[]).length}</div></div><div class="card"><div class="muted">Low Stock Items</div><div class="metric">${low}</div></div></div><div class="card"><h3>Recent Activity</h3>${activity.slice(0,25).map(a=>`<div class="activity"><span class="dot"></span><div><b>${esc(a.title)}</b><div>${esc(a.text)}</div><div class="muted">${new Date(a.t).toLocaleString()}</div></div></div>`).join("")||'<div class="empty">No activity yet</div>'}</div>`}
async function orders(){const [o,c,s]=await Promise.all([getOrders(),getCustomers(),db.from('profiles').select('id,full_name').eq('active',true).order('full_name')]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name])),sm=Object.fromEntries((s.data||[]).map(x=>[x.id,x.full_name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newOrder()">+ New Order</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Service</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Due</th><th>Priority</th><th>Assigned</th><th>Stage</th><th>Action</th></tr>${o.map(x=>{const total=(Number(x.quantity)||0)*(Number(x.unit_price)||0);return `<tr><td><b>${esc(cm[x.customer_id]||'Unknown customer')}</b></td><td>${esc(x.order_no)}</td><td>${esc(x.service||'')}</td><td>${esc(x.product||'')}</td><td>${esc(x.quantity)}</td><td>${money(x.unit_price)}</td><td>${money(total)}</td><td>${esc(x.due_date||'')}</td><td>${esc(x.priority||'')}</td><td>${esc(sm[x.assigned_to]||'Unassigned')}</td><td>${esc(x.stage||'')}</td><td><button class="btn" onclick="editOrder('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('orders','${x.id}','order')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="12" class="empty">No orders yet</td></tr>'}</table></div>`}
async function newOrder(){const [c,s]=await Promise.all([getCustomers(),db.from('profiles').select('id,full_name').eq('active',true).order('full_name')]);modal('New Order',`<label>Customer<select id="oCustomer">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Order No<input id="oNo" placeholder="MC-0001"></label><label>Service<select id="oService"><option>Wholesale</option><option>Corporate</option><option>R2W</option><option>Bespoke</option><option>School Uniform</option><option>Hotel Uniform</option><option>Wedding</option></select></label><label>Product<input id="oProduct" placeholder="Senator"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Quantity<input id="oQty" type="number" min="1" value="1"></label><label>Unit<select id="oUnit"><option>pcs</option><option>pair</option><option>package</option><option>yard</option></select></label></div><label>Unit Price<input id="oPrice" type="number" min="0"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Due Date<input id="oDue" type="date"></label><label>Priority<select id="oPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></label></div><label>Assigned Staff<select id="oAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></label><label>Fabric<input id="oFabric"></label><label>Measurements / Sizes<textarea id="oMeasurements"></textarea></label><label>Notes<textarea id="oNotes"></textarea></label>`,'saveOrder()')}
async function saveOrder(){const r=await db.from('orders').insert({customer_id:oCustomer.value,order_no:oNo.value.trim(),service:oService.value,product:oProduct.value.trim(),quantity:+oQty.value,unit:oUnit.value,unit_price:+oPrice.value,due_date:oDue.value||null,priority:oPriority.value,assigned_to:oAssigned.value||null,fabric:oFabric.value.trim(),measurements:oMeasurements.value.trim(),notes:oNotes.value.trim(),stage:'Procurement'});if(r.error)return toast(r.error.message);await logActivity('Order created',oNo.value);document.querySelector('.modalback')?.remove();orders()}
async function editOrder(id){const [r,c,s]=await Promise.all([db.from('orders').select('*').eq('id',id).single(),getCustomers(),db.from('profiles').select('id,full_name').eq('active',true).order('full_name')]);if(r.error)return toast(r.error.message);modal('Edit Order',`<label>Customer<select id="eoCustomer">${c.map(x=>`<option value="${x.id}" ${x.id===r.data.customer_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Order No<input id="eoNo" value="${esc(r.data.order_no||'')}"></label><label>Service<select id="eoService">${['Wholesale','Corporate','R2W','Bespoke','School Uniform','Hotel Uniform','Wedding'].map(x=>`<option ${x===r.data.service?'selected':''}>${x}</option>`).join('')}</select></label><label>Product<input id="eoProduct" value="${esc(r.data.product||'')}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Quantity<input id="eoQty" type="number" min="1" value="${r.data.quantity||1}"></label><label>Unit<select id="eoUnit">${['pcs','pair','package','yard'].map(x=>`<option ${x===r.data.unit?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Unit Price<input id="eoPrice" type="number" min="0" value="${r.data.unit_price||0}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Due Date<input id="eoDue" type="date" value="${esc(r.data.due_date||'')}"></label><label>Priority<select id="eoPriority">${['Normal','High','Urgent'].map(x=>`<option ${x===r.data.priority?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Assigned Staff<select id="eoAssigned"><option value="">Unassigned</option>${(s.data||[]).map(x=>`<option value="${x.id}" ${x.id===r.data.assigned_to?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select></label><label>Fabric<input id="eoFabric" value="${esc(r.data.fabric||'')}"></label><label>Measurements / Sizes<textarea id="eoMeasurements">${esc(r.data.measurements||'')}</textarea></label><label>Notes<textarea id="eoNotes">${esc(r.data.notes||'')}</textarea></label><label>Stage<select id="eoStage">${stageOptions(r.data.stage)}</select></label>`,'saveOrderEdit(\''+id+'\')')}
async function saveOrderEdit(id){const r=await db.from('orders').update({customer_id:eoCustomer.value,order_no:eoNo.value.trim(),service:eoService.value,product:eoProduct.value.trim(),quantity:+eoQty.value,unit:eoUnit.value,unit_price:+eoPrice.value,due_date:eoDue.value||null,priority:eoPriority.value,assigned_to:eoAssigned.value||null,fabric:eoFabric.value.trim(),measurements:eoMeasurements.value.trim(),notes:eoNotes.value.trim(),stage:eoStage.value}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Order updated',eoNo.value);document.querySelector('.modalback')?.remove();orders()}
async function salesactivity(){const [r,c]=await Promise.all([db.from('sales_activities').select('*').order('created_at',{ascending:false}),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newSales()">+ Log Sales Call / WhatsApp</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Type</th><th>Outcome</th><th>Notes</th><th>Date</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td><b>${esc(cm[x.customer_id]||'Unknown customer')}</b></td><td>${esc(x.activity_type||'')}</td><td>${esc(x.outcome||'')}</td><td>${esc(x.notes||'')}</td><td>${esc(x.created_at||'')}</td><td><button class="btn danger" onclick="deleteRecord('sales_activities','${x.id}','sales activity')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sales activity yet</td></tr>'}</table></div>`}
async function newSales(){const c=await getCustomers();modal('Log Sales Call / WhatsApp',`<label>Customer<select id="sCustomer">${c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Type<select id="sType"><option>Call</option><option>WhatsApp</option><option>Visit</option><option>Email</option></select></label><label>Outcome<input id="sOutcome"></label><label>Notes<textarea id="sNotes"></textarea></label>`,'saveSales()')}

async function production(){const [r,o,c,s]=await Promise.all([db.from('order_production_items').select('*').order('created_at',{ascending:false}),getOrders(),getCustomers(),db.from('profiles').select('id,full_name,role').eq('active',true).order('full_name')]);const om=Object.fromEntries(o.map(x=>[x.id,x])),cm=Object.fromEntries(c.map(x=>[x.id,x.name])),sm=Object.fromEntries((s.data||[]).map(x=>[x.id,x.full_name]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newProductionTask()">+ New Production Task</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Item</th><th>Qty</th><th>Unit</th><th>Stage</th><th>Assigned To</th><th>Status</th><th>Notes</th><th>Action</th></tr>${(r.data||[]).map(x=>{const ord=om[x.order_id];return `<tr><td><b>${esc(cm[ord?.customer_id]||'Unknown customer')}</b></td><td>${esc(ord?.order_no||'')}</td><td>${esc(x.item_name||'')}</td><td>${esc(x.quantity)}</td><td>${esc(x.unit||'')}</td><td>${esc(x.stage||'')}</td><td>${esc(sm[x.assigned_to]||'Unassigned')}</td><td>${esc(x.status||'')}</td><td>${esc(x.notes||'')}</td><td><button class="btn" onclick="editProductionTask('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('order_production_items','${x.id}','production task')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">No production tasks yet</td></tr>'}</table></div>`}

async function procurement(){const [r,c,o]=await Promise.all([db.from('procurement_requests').select('*').order('created_at',{ascending:false}),getCustomers(),getOrders()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name])),om=Object.fromEntries(o.map(x=>[x.id,x.order_no]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newProcurement()">+ New Procurement</button></div><div class="tablewrap"><table class="table"><tr><th>Material</th><th>Qty</th><th>Unit</th><th>Unit Cost</th><th>Total</th><th>Supplier</th><th>Customer</th><th>Order</th><th>Status</th><th>Action</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.item||x.material||'')}</td><td>${esc(x.quantity)}</td><td>${esc(x.unit||'')}</td><td>${money(x.unit_cost||0)}</td><td>${money(x.amount||((Number(x.quantity)||0)*(Number(x.unit_cost)||0)))}</td><td>${esc(x.supplier||'')}</td><td>${esc(cm[x.customer_id]||'')}</td><td>${esc(om[x.order_id]||'')}</td><td>${esc(x.status||'')}</td><td><button class="btn" onclick="editProcurement('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('procurement_requests','${x.id}','procurement request')">Delete</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No procurement requests yet</td></tr>'}</table></div>`}

async function inventory(){const [i,t,s,o]=await Promise.all([db.from('inventory_items').select('*').order('name'),db.from('store_transactions').select('*').order('created_at',{ascending:false}).limit(100),db.from('profiles').select('id,full_name,role').eq('active',true).order('full_name'),getOrders()]);const sm=Object.fromEntries((s.data||[]).map(x=>[x.id,x.full_name])),om=Object.fromEntries(o.map(x=>[x.id,x.order_no]));content.innerHTML=`<div class="bar"><button class="btn" onclick="newInventory()">+ Add Stock Item</button><button class="btn gold" onclick="newInventoryTxn()">+ Issue / Return / Receive Stock</button></div><div class="tablewrap"><table class="table"><tr><th>Item</th><th>SKU</th><th>Category</th><th>Unit</th><th>Stock</th><th>Reorder</th><th>Unit Cost</th><th>Action</th></tr>${(i.data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code||'')}</td><td>${esc(x.category||'')}</td><td>${esc(x.unit||'')}</td><td>${esc(x.stock)}</td><td>${esc(x.reorder_level)}</td><td>${money(x.unit_cost)}</td><td><button class="btn" onclick="editInventory('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('inventory_items','${x.id}','inventory item')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No stock items yet</td></tr>'}</table></div><div class="card" style="margin-top:16px"><h3>Recent Stock Movements</h3><div class="tablewrap"><table class="table"><tr><th>Item</th><th>Type</th><th>Qty</th><th>Assigned To</th><th>Order</th><th>Notes</th></tr>${(t.data||[]).map(x=>`<tr><td>${esc(i.data?.find(y=>y.id===x.inventory_item_id)?.name||'Unknown item')}</td><td>${esc(x.transaction_type||'')}</td><td>${esc(x.quantity)}</td><td>${esc(sm[x.assigned_to]||'')}</td><td>${esc(om[x.order_id]||'')}</td><td>${esc(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No movements yet</td></tr>'}</table></div></div>`}
async function newInventory(){modal('Add Stock Item',`<label>Item Name<input id="iName"></label><label>SKU / Code<input id="iCode" placeholder="e.g. FAB-001"></label><label>Category<input id="iCategory" placeholder="Fabric, Accessory, Packaging..."></label><label>Unit<select id="iUnit"><option>yard</option><option>pcs</option><option>pair</option><option>package</option></select></label><label>Opening Stock<input id="iStock" type="number" step="0.01" value="0"></label><label>Reorder Level<input id="iReorder" type="number" step="0.01" value="0"></label><label>Unit Cost<input id="iCost" type="number" step="0.01" value="0"></label>`,'saveInventory()')}

async function editInventory(id){const r=await db.from('inventory_items').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Stock Item',`<label>Item Name<input id="eiName" value="${esc(r.data.name||'')}"></label><label>SKU / Code<input id="eiCode" value="${esc(r.data.code||'')}"></label><label>Category<input id="eiCategory" value="${esc(r.data.category||'')}"></label><label>Unit<select id="eiUnit">${['yard','pcs','pair','package'].map(x=>`<option ${x===r.data.unit?'selected':''}>${x}</option>`).join('')}</select></label><label>Stock<input id="eiStock" type="number" step="0.01" value="${r.data.stock||0}"></label><label>Reorder Level<input id="eiReorder" type="number" step="0.01" value="${r.data.reorder_level||0}"></label><label>Unit Cost<input id="eiCost" type="number" step="0.01" value="${r.data.unit_cost||0}"></label>`,'saveInventoryEdit(\''+id+'\')')}

async function newInventoryTxn(){const [i,s,o]=await Promise.all([db.from('inventory_items').select('id,name,unit,stock').order('name'),db.from('profiles').select('id,full_name,role').eq('active',true).order('full_name'),getOrders()]);if(!i.data?.length)return toast('Add a stock item first.');modal('Issue / Return / Receive Stock',`<label>Item<select id="itItem">${(i.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.unit)} · Stock: ${esc(x.stock)}</option>`).join('')}</select></label><label>Type<select id="itType"><option>Issue</option><option>Return</option><option>Receive</option></select></label><label>Quantity<input id="itQty" type="number" min="0.01" step="0.01" value="1"></label><label>Assigned To<select id="itAssigned"><option value="">None</option>${(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.full_name)} · ${esc(x.role)}</option>`).join('')}</select></label><label>Order<select id="itOrder"><option value="">None</option>${o.map(x=>`<option value="${x.id}">${esc(x.order_no)} · ${esc(x.product)}</option>`).join('')}</select></label><label>Notes<textarea id="itNotes"></textarea></label>`,'saveInventoryTxn()')}
async function saveInventoryTxn(){const qty=Number(itQty.value)||0;if(qty<=0)return toast('Enter a quantity greater than 0.');const item=await db.from('inventory_items').select('id,name,unit,stock').eq('id',itItem.value).single();if(item.error)return toast(item.error.message);const current=Number(item.data.stock)||0;let next=current;if(itType.value==='Issue'){if(qty>current)return toast(`Not enough stock. Available: ${current} ${item.data.unit}`);next=current-qty}else if(itType.value==='Return'||itType.value==='Receive'){next=current+qty}const r=await db.from('store_transactions').insert({inventory_item_id:item.data.id,order_id:itOrder.value||null,assigned_to:itAssigned.value||null,transaction_type:itType.value,quantity:qty,unit:item.data.unit,issued_by:itType.value==='Issue'?user.id:null,received_by:itType.value!=='Issue'?user.id:null,notes:itNotes.value.trim()});if(r.error)return toast(r.error.message);const u=await db.from('inventory_items').update({stock:next}).eq('id',item.data.id);if(u.error)return toast(u.error.message);await logActivity('Stock movement recorded',`${itType.value}: ${qty} ${item.data.unit} · ${item.data.name}`);document.querySelector('.modalback')?.remove();inventory()}

async function editCustomer(id){const r=await db.from('customers').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);modal('Edit Customer',`<label>Name<input id="ecName" value="${esc(r.data.name||'')}"></label><label>Type<select id="ecType">${['Retail','Corporate','Wholesale','School','Hotel','Wedding'].map(x=>`<option ${x===r.data.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Phone<input id="ecPhone" value="${esc(r.data.phone||'')}"></label><label>Email<input id="ecEmail" type="email" value="${esc(r.data.email||'')}"></label><label>Address<textarea id="ecAddress">${esc(r.data.address||'')}</textarea></label>`,'saveCustomerEdit(\''+id+'\')')}
async function saveCustomerEdit(id){const r=await db.from('customers').update({name:ecName.value.trim(),type:ecType.value,phone:ecPhone.value.trim(),email:ecEmail.value.trim(),address:ecAddress.value.trim()}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Customer updated',ecName.value);document.querySelector('.modalback')?.remove();customers()}
async function payments(){const [r,o,c]=await Promise.all([db.from('payments').select('*').order('created_at',{ascending:false}),getOrders(),getCustomers()]);const om=Object.fromEntries(o.map(x=>[x.id,x])),cm=Object.fromEntries(c.map(x=>[x.id,x.name]));const totals={};(r.data||[]).forEach(x=>totals[x.order_id]=(totals[x.order_id]||0)+Number(x.amount||0));content.innerHTML=`<div class="bar"><button class="btn" onclick="newPayment()">+ Record Payment</button></div><div class="tablewrap"><table class="table"><tr><th>Customer</th><th>Order</th><th>Product</th><th>Order Total</th><th>Amount Paid</th><th>Balance</th><th>Method</th><th>Date</th><th>Action</th></tr>${(r.data||[]).map(x=>{const ord=om[x.order_id],total=ord?(Number(ord.quantity)||0)*(Number(ord.unit_price)||0):0,paid=totals[x.order_id]||0;return `<tr><td><b>${esc(cm[ord?.customer_id]||'Unknown customer')}</b></td><td>${esc(ord?.order_no||'')}</td><td>${esc(ord?.product||'')}</td><td>${money(total)}</td><td>${money(paid)}</td><td>${money(Math.max(0,total-paid))}</td><td>${esc(x.method||'')}</td><td>${esc(x.paid_on||x.created_at||'')}</td><td><button class="btn" onclick="editPayment('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRecord('payments','${x.id}','payment')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No payments yet</td></tr>'}</table></div>`}
async function newPayment(){const [o,c]=await Promise.all([getOrders(),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));modal('Record Payment',`<label>Customer / Order<select id="pmtOrder">${o.map(x=>`<option value="${x.id}">${esc(cm[x.customer_id]||'Unknown')} · ${esc(x.order_no)} · ${esc(x.product)}</option>`).join('')}</select></label><label>Amount Paid<input id="pmtAmount" type="number" min="0"></label><label>Method<select id="pmtMethod"><option>Cash</option><option>Transfer</option><option>POS</option><option>Card</option></select></label><label>Date<input id="pmtDate" type="date"></label>`,'savePayment()')}
async function savePayment(){const r=await db.from('payments').insert({order_id:pmtOrder.value,amount:+pmtAmount.value,method:pmtMethod.value,paid_on:pmtDate.value||null});if(r.error)return toast(r.error.message);await logActivity('Payment recorded',money(pmtAmount.value));document.querySelector('.modalback')?.remove();payments()}
async function editPayment(id){const r=await db.from('payments').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const [o,c]=await Promise.all([getOrders(),getCustomers()]);const cm=Object.fromEntries(c.map(x=>[x.id,x.name]));modal('Edit Payment',`<label>Customer / Order<select id="epOrder">${o.map(x=>`<option value="${x.id}" ${x.id===r.data.order_id?'selected':''}>${esc(cm[x.customer_id]||'Unknown')} · ${esc(x.order_no)} · ${esc(x.product)}</option>`).join('')}</select></label><label>Amount Paid<input id="epAmount" type="number" value="${r.data.amount||0}"></label><label>Method<select id="epMethod">${['Cash','Transfer','POS','Card'].map(x=>`<option ${x===r.data.method?'selected':''}>${x}</option>`).join('')}</select></label><label>Date<input id="epDate" type="date" value="${esc(r.data.paid_on||'')}"></label>`,'savePaymentEdit(\''+id+'\')')}
async function savePaymentEdit(id){const r=await db.from('payments').update({order_id:epOrder.value,amount:+epAmount.value,method:epMethod.value,paid_on:epDate.value||null}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Payment updated',id);document.querySelector('.modalback')?.remove();payments()}
function modal(title,html,save){document.querySelector('.modalback')?.remove();const d=document.createElement('div');d.className='modalback';d.innerHTML=`<div class="modal"><h2>${esc(title)}</h2>${html}<div class="actions"><button class="btn gray" onclick="this.closest('.modalback').remove()">Cancel</button><button class="btn" onclick="${save}">Save</button></div></div>`;document.body.appendChild(d)}
async function staff(){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').select('*').order('full_name');if(r.error)return toast(r.error.message);content.innerHTML=`<div class="bar"><button class="btn" onclick="newStaff()">+ Add Staff</button></div><div class="tablewrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email||'')}</td><td>${esc(x.role||'')}</td><td>${x.active?'Active':'Inactive'}</td><td><button class="btn" onclick="editStaff('${x.id}')">Edit</button> <button class="btn gray" onclick="toggleStaff('${x.id}',${!x.active})">${x.active?'Deactivate':'Activate'}</button> <button class="btn danger" onclick="deleteStaff('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No staff yet</td></tr>`}
async function newStaff(){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const roles=await db.from('erp_roles').select('name').eq('active',true).order('name');modal('Add Staff Profile',`<p class="muted">Create the staff login in Supabase Authentication first, then enter the same User ID here.</p><label>Auth User ID<input id="nsId" placeholder="UUID from Authentication"></label><label>Full Name<input id="nsName"></label><label>Email<input id="nsEmail" type="email"></label><label>Role<select id="nsRole">${(roles.data||[]).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></label><label><input id="nsActive" type="checkbox" checked style="width:auto"> Active</label>`,'saveStaff()')}
async function saveStaff(){const r=await db.from('profiles').insert({id:nsId.value.trim(),full_name:nsName.value.trim(),email:nsEmail.value.trim(),role:nsRole.value,active:nsActive.checked});if(r.error)return toast(r.error.message);await logActivity('Staff profile created',nsName.value);document.querySelector('.modalback')?.remove();staff()}
async function editStaff(id){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').select('*').eq('id',id).single();if(r.error)return toast(r.error.message);const roles=await db.from('erp_roles').select('name').eq('active',true).order('name');modal('Edit Staff',`<label>Full Name<input id="esName" value="${esc(r.data.full_name||'')}"></label><label>Email<input id="esEmail" type="email" value="${esc(r.data.email||'')}"></label><label>Role<select id="esRole">${(roles.data||[]).map(x=>`<option ${x.name===r.data.role?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label><input id="esActive" type="checkbox" ${r.data.active?'checked':''} style="width:auto"> Active</label>`,'saveStaffEdit(\''+id+'\')')}
async function saveStaffEdit(id){const r=await db.from('profiles').update({full_name:esName.value.trim(),email:esEmail.value.trim(),role:esRole.value,active:esActive.checked}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Staff profile updated',esName.value);document.querySelector('.modalback')?.remove();staff()}
async function toggleStaff(id,active){if(profile?.role!=='Management')return toast('Only Management can manage staff.');const r=await db.from('profiles').update({active}).eq('id',id);if(r.error)return toast(r.error.message);await logActivity(active?'Staff activated':'Staff deactivated',id);staff()}
async function deleteStaff(id){if(profile?.role!=='Management')return toast('Only Management can manage staff.');if(id===user.id)return toast('You cannot delete your own active profile. Deactivate it instead.');if(!confirm('Delete this staff profile? The authentication account is not deleted.'))return;const r=await db.from('profiles').delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Staff profile deleted',id);staff()}
async function roles(){if(profile?.role!=='Management')return toast('Only Management can manage roles and permissions.');const [r,p]=await Promise.all([db.from('erp_roles').select('*').order('name'),db.from('erp_role_permissions').select('*')]);if(r.error)return toast(r.error.message);if(p.error)return toast(p.error.message);const permsBy={};(p.data||[]).forEach(x=>(permsBy[x.role_id]||(permsBy[x.role_id]=[])).push(x.permission));content.innerHTML=`<div class="bar"><button class="btn" onclick="newRole()">+ Add Role</button></div><div class="tablewrap"><table class="table"><tr><th>Role</th><th>Description</th><th>Permissions</th><th>Actions</th></tr>${(r.data||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description||'')}</td><td>${esc((permsBy[x.id]||[]).join(', ')||'None')}</td><td><button class="btn" onclick="editRole('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRole('${x.id}','${esc(x.name)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No roles yet</td></tr>'}</table></div>`}
async function newRole(){modal('Add Role',`<label>Role Name<input id="nrName"></label><label>Description<textarea id="nrDesc"></textarea></label><label>Permissions</label><div>${menu.map(x=>`<label style="display:block"><input type="checkbox" class="nrPerm" value="${x[0]}" style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRole()')}
async function saveRole(){if(profile?.role!=='Management')return toast('Only Management can manage roles.');const r=await db.from('erp_roles').insert({name:nrName.value.trim(),description:nrDesc.value.trim(),active:true}).select().single();if(r.error)return toast(r.error.message);const selected=[...document.querySelectorAll('.nrPerm:checked')].map(x=>({role_id:r.data.id,permission:x.value}));if(selected.length){const p=await db.from('erp_role_permissions').insert(selected);if(p.error)return toast(p.error.message)}await logActivity('Role created',nrName.value);document.querySelector('.modalback')?.remove();roles()}
async function editRole(id){if(profile?.role!=='Management')return toast('Only Management can edit roles.');const [r,p]=await Promise.all([db.from('erp_roles').select('*').eq('id',id).single(),db.from('erp_role_permissions').select('permission').eq('role_id',id)]);if(r.error)return toast(r.error.message);const selected=new Set((p.data||[]).map(x=>x.permission));modal('Edit Role',`<label>Role Name<input id="erName" value="${esc(r.data.name)}"></label><label>Description<textarea id="erDesc">${esc(r.data.description||'')}</textarea></label><label>Permissions</label><div>${menu.map(x=>`<label style="display:block"><input type="checkbox" class="erPerm" value="${x[0]}" ${selected.has(x[0])?'checked':''} style="width:auto"> ${x[1]}</label>`).join('')}</div>`,'saveRoleEdit(\''+id+'\')')}
async function saveRoleEdit(id){const r=await db.from('erp_roles').update({name:erName.value.trim(),description:erDesc.value.trim()}).eq('id',id);if(r.error)return toast(r.error.message);const d=await db.from('erp_role_permissions').delete().eq('role_id',id);if(d.error)return toast(d.error.message);const selected=[...document.querySelectorAll('.erPerm:checked')].map(x=>({role_id:id,permission:x.value}));if(selected.length){const p=await db.from('erp_role_permissions').insert(selected);if(p.error)return toast(p.error.message)}await logActivity('Role updated',erName.value);document.querySelector('.modalback')?.remove();roles()}
async function deleteRole(id,name){if(profile?.role!=='Management')return toast('Only Management can delete roles.');const used=await db.from('profiles').select('id').eq('role',name).limit(1);if(used.data?.length)return toast('This role is assigned to a staff member. Reassign them before deleting it.');if(!confirm('Delete role '+name+'?'))return;const r=await db.from('erp_roles').delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity('Role deleted',name);roles()}
async function audit(){const r=await db.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(200);content.innerHTML=`<div class="tablewrap"><table class="table"><tr><th>Date</th><th>Action</th><th>Details</th><th>User</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.details||'')}</td><td>${esc(x.user_id||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit records yet</td></tr>'}</table></div>`}
async function deleteRecord(table,id,label){if(profile?.role!=='Management')return toast('Only Management can delete records.');if(!confirm('Delete '+label+'? This cannot be undone.'))return;const r=await db.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message);await logActivity(`${label} deleted`,id);go(view)}
init();
</script>
<script>
/* MARKCHARLES SEARCH V2 */
(function(){
  const oldGo=window.go;
  const searchable=new Set(['orders','salesactivity','production','procurement','inventory','qa','customers','payments','staff','roles','audit']);
  function addSearch(viewName){
    if(!searchable.has(viewName)) return;
    const old=document.getElementById('erpUniversalSearch');
    if(old) old.remove();
    const host=document.getElementById('content');
    const table=host?.querySelector('table.table');
    const wrap=host?.querySelector('.tablewrap');
    if(!host || !table || !wrap) return;
    const box=document.createElement('div');
    box.id='erpUniversalSearch';
    box.className='bar';
    box.style.cssText='background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:14px 0 0;';
    box.innerHTML='<div style="display:flex;gap:8px;width:100%;align-items:center"><input id="erpSearchInput" type="search" placeholder="Search by customer, order, payment, product, staff..." autocomplete="off" style="margin:0;flex:1"><button class="btn" id="erpSearchButton" type="button">Search</button><button class="btn gray" id="erpSearchClear" type="button">Clear</button></div><div id="erpSearchCount" class="muted" style="margin-top:6px"></div>';
    wrap.parentNode.insertBefore(box,wrap);
    const input=box.querySelector('#erpSearchInput');
    const count=box.querySelector('#erpSearchCount');
    const searchButton=box.querySelector('#erpSearchButton');
    const clear=box.querySelector('#erpSearchClear');
    const rows=()=>Array.from(table.querySelectorAll('tr')).slice(1);
    function run(){const q=input.value.trim().toLowerCase();let shown=0,total=0;rows().forEach(row=>{total++;const match=!q||row.textContent.toLowerCase().includes(q);row.style.display=match?'':'none';if(match)shown++;});count.textContent=q?`${shown} of ${total} records shown`:`${total} records`;}
    input.addEventListener('input',run);
    searchButton.addEventListener('click',run);
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run();}});
    clear.addEventListener('click',()=>{input.value='';run();input.focus();});
    input.addEventListener('keydown',e=>{if(e.key==='Escape'){input.value='';run();}});
    run();
  }
  window.go=async function(v){await oldGo(v);setTimeout(()=>addSearch(v),20)};
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){const input=document.getElementById('erpSearchInput');if(input){e.preventDefault();input.focus();input.select();}}});
})();
</script>
